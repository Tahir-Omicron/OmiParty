<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00e5ff" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Icon -->
  <g transform="translate(4, 6)">
    <rect width="48" height="48" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1.2"/>
    <circle cx="24" cy="24" r="13" fill="none" stroke="url(#logoGrad)" stroke-width="4.5" filter="url(#logoGlow)"/>
    <circle cx="24" cy="18" r="2" fill="#00e5ff"/>
    <circle cx="18" cy="27" r="2" fill="#a855f7"/>
    <circle cx="30" cy="27" r="2" fill="#3b82f6"/>
  </g>
  <!-- Text -->
  <text x="64" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="1">OTAQ<tspan fill="#00e5ff">.gg</tspan></text>
</svg>
