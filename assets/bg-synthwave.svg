<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Smooth Twilight Sky Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06020c"/>
      <stop offset="35%" stop-color="#140526"/>
      <stop offset="70%" stop-color="#360a47"/>
      <stop offset="100%" stop-color="#690e52"/>
    </linearGradient>

    <!-- Outrun Sun Gradient -->
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="40%" stop-color="#ff007f"/>
      <stop offset="70%" stop-color="#ff5400"/>
      <stop offset="100%" stop-color="#ffbe0b"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- TWINKLING STARS IN SKY (Stationary & Crisp) -->
  <g fill="#ffffff" opacity="0.8">
    <rect x="120" y="60" width="3" height="3"/>
    <rect x="260" y="120" width="2" height="2"/>
    <rect x="420" y="70" width="4" height="4" fill="#00f0ff" filter="url(#neonGlow)"/>
    <rect x="620" y="110" width="3" height="3"/>
    <rect x="820" y="50" width="2" height="2"/>
    <rect x="1100" y="60" width="4" height="4" fill="#ffbe0b"/>
    <rect x="1320" y="80" width="3" height="3"/>
    <rect x="1520" y="60" width="4" height="4" fill="#ff007f" filter="url(#neonGlow)"/>
    <rect x="1720" y="90" width="3" height="3" fill="#00f0ff"/>
    <rect x="1860" y="50" width="2" height="2"/>
    <rect x="300" y="190" width="2" height="2"/>
    <rect x="700" y="170" width="3" height="3"/>
    <rect x="1220" y="180" width="2" height="2"/>
    <rect x="1620" y="170" width="3" height="3"/>
  </g>

  <!-- DISTANT MOUNTAINS -->
  <polygon points="0,620 180,500 360,570 540,470 720,550 900,450 1080,540 1260,440 1440,530 1620,470 1800,560 1920,490 1920,760 0,760" fill="#170626" opacity="0.85"/>
  <polygon points="0,660 140,560 300,620 480,530 660,610 840,520 1020,600 1200,510 1380,590 1560,530 1740,610 1920,550 1920,760 0,760" fill="#220938" opacity="0.95"/>

  <!-- HORIZON OUTRUN SUN (Clean & Elevated) -->
  <g filter="url(#sunGlow)">
    <circle cx="960" cy="400" r="210" fill="url(#sunGrad)"/>
    <!-- Horizontal Perspective Blind Slices -->
    <rect x="700" y="350" width="520" height="7" fill="#140526"/>
    <rect x="700" y="372" width="520" height="10" fill="#140526"/>
    <rect x="700" y="398" width="520" height="14" fill="#140526"/>
    <rect x="700" y="430" width="520" height="19" fill="#140526"/>
    <rect x="700" y="468" width="520" height="26" fill="#140526"/>
    <rect x="700" y="512" width="520" height="34" fill="#140526"/>
    <rect x="700" y="564" width="520" height="44" fill="#140526"/>
  </g>

  <!-- FAR SKYLINE SILHOUETTES -->
  <g fill="#120320">
    <rect x="60" y="420" width="90" height="340"/>
    <line x1="105" y1="420" x2="105" y2="340" stroke="#ff007f" stroke-width="2"/>
    <circle cx="105" cy="340" r="3" fill="#ff007f"/>

    <rect x="200" y="380" width="110" height="380"/>
    <rect x="360" y="440" width="90" height="320"/>
    <rect x="490" y="360" width="130" height="400"/>
    <line x1="555" y1="360" x2="555" y2="280" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="555" cy="280" r="4" fill="#00f0ff" filter="url(#neonGlow)"/>

    <rect x="1300" y="370" width="130" height="390"/>
    <line x1="1365" y1="370" x2="1365" y2="290" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="1365" cy="290" r="4" fill="#00f0ff" filter="url(#neonGlow)"/>

    <rect x="1470" y="430" width="100" height="330"/>
    <rect x="1620" y="380" width="120" height="380"/>
    <line x1="1680" y1="380" x2="1680" y2="300" stroke="#ff007f" stroke-width="2"/>
    <circle cx="1680" cy="300" r="3" fill="#ff007f"/>
    <rect x="1780" y="420" width="90" height="340"/>
  </g>

  <!-- FLANKING FOREGROUND CYBERPUNK BUILDINGS (Clean, Detailed & Stationary) -->
  <g fill="#090114">
    <!-- Left Building 1 -->
    <rect x="0" y="480" width="90" height="280"/>
    <rect x="110" y="420" width="120" height="340"/>
    <polygon points="110,420 170,370 230,420"/>
    <line x1="170" y1="370" x2="170" y2="300" stroke="#ff007f" stroke-width="3"/>
    <circle cx="170" cy="300" r="4" fill="#ff007f" filter="url(#neonGlow)"/>

    <!-- Left Building 2 (Spire) -->
    <rect x="260" y="490" width="100" height="270"/>
    <rect x="390" y="410" width="140" height="350"/>
    <line x1="460" y1="410" x2="460" y2="320" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="460" cy="320" r="4" fill="#00f0ff" filter="url(#neonGlow)"/>

    <!-- Right Building 1 (Spire) -->
    <rect x="1390" y="420" width="140" height="340"/>
    <polygon points="1390,420 1460,370 1530,420"/>
    <line x1="1460" y1="370" x2="1460" y2="290" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="1460" cy="290" r="4" fill="#00f0ff" filter="url(#neonGlow)"/>

    <!-- Right Building 2 -->
    <rect x="1560" y="470" width="110" height="290"/>
    <rect x="1700" y="430" width="130" height="330"/>
    <line x1="1765" y1="430" x2="1765" y2="340" stroke="#ff007f" stroke-width="3"/>
    <circle cx="1765" cy="340" r="4" fill="#ff007f" filter="url(#neonGlow)"/>
    <rect x="1850" y="480" width="70" height="280"/>
  </g>

  <!-- STATIONARY NEON SIGNS -->
  <g filter="url(#neonGlow)">
    <rect x="125" y="450" width="90" height="24" fill="#150221" stroke="#00f0ff" stroke-width="2"/>
    <text x="170" y="467" fill="#00f0ff" font-family="'Courier New', monospace" font-weight="900" font-size="13" text-anchor="middle" letter-spacing="2">OTAQ.GG</text>

    <rect x="410" y="440" width="100" height="26" fill="#150221" stroke="#ff007f" stroke-width="2"/>
    <text x="460" y="459" fill="#ff007f" font-family="'Courier New', monospace" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="3">8-BIT</text>

    <rect x="1410" y="450" width="100" height="24" fill="#150221" stroke="#00f0ff" stroke-width="2"/>
    <text x="1460" y="467" fill="#00f0ff" font-family="'Courier New', monospace" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="2">NEO TOKYO</text>

    <rect x="1720" y="460" width="90" height="24" fill="#150221" stroke="#ffbe0b" stroke-width="2"/>
    <text x="1765" y="477" fill="#ffbe0b" font-family="'Courier New', monospace" font-weight="900" font-size="13" text-anchor="middle" letter-spacing="2">CHAOS</text>
  </g>

  <!-- GLOWING PIXEL WINDOWS -->
  <g opacity="0.9">
    <!-- Left Windows -->
    <rect x="130" y="490" width="8" height="12" fill="#00f0ff"/>
    <rect x="150" y="490" width="8" height="12" fill="#ff007f"/>
    <rect x="170" y="490" width="8" height="12" fill="#ffbe0b"/>
    <rect x="190" y="490" width="8" height="12" fill="#00f0ff"/>
    <rect x="130" y="520" width="8" height="12" fill="#ff007f"/>
    <rect x="150" y="520" width="8" height="12" fill="#00f0ff"/>
    <rect x="190" y="520" width="8" height="12" fill="#ffbe0b"/>

    <rect x="410" y="480" width="10" height="14" fill="#ff007f"/>
    <rect x="435" y="480" width="10" height="14" fill="#00f0ff"/>
    <rect x="460" y="480" width="10" height="14" fill="#00f0ff"/>
    <rect x="485" y="480" width="10" height="14" fill="#ffbe0b"/>
    <rect x="410" y="510" width="10" height="14" fill="#00f0ff"/>
    <rect x="460" y="510" width="10" height="14" fill="#ff007f"/>

    <!-- Right Windows -->
    <rect x="1410" y="490" width="10" height="14" fill="#00f0ff"/>
    <rect x="1435" y="490" width="10" height="14" fill="#ff007f"/>
    <rect x="1460" y="490" width="10" height="14" fill="#00f0ff"/>
    <rect x="1485" y="490" width="10" height="14" fill="#ffbe0b"/>
    <rect x="1410" y="520" width="10" height="14" fill="#ffbe0b"/>
    <rect x="1460" y="520" width="10" height="14" fill="#ff007f"/>

    <rect x="1720" y="500" width="10" height="14" fill="#ff007f"/>
    <rect x="1745" y="500" width="10" height="14" fill="#00f0ff"/>
    <rect x="1770" y="500" width="10" height="14" fill="#ffbe0b"/>
    <rect x="1720" y="530" width="10" height="14" fill="#00f0ff"/>
    <rect x="1770" y="530" width="10" height="14" fill="#ff007f"/>
  </g>

  <!-- 3D OUTRUN HORIZON HIGHWAY GRID (Stationary & Razor Sharp) -->
  <g stroke="#ff007f" stroke-width="2" opacity="0.65">
    <line x1="0" y1="740" x2="1920" y2="740" stroke="#00f0ff" stroke-width="4" filter="url(#neonGlow)"/>
    <line x1="0" y1="770" x2="1920" y2="770"/>
    <line x1="0" y1="805" x2="1920" y2="805"/>
    <line x1="0" y1="845" x2="1920" y2="845"/>
    <line x1="0" y1="895" x2="1920" y2="895"/>
    <line x1="0" y1="955" x2="1920" y2="955"/>
    <line x1="0" y1="1025" x2="1920" y2="1025"/>
    <line x1="0" y1="1080" x2="1920" y2="1080" stroke="#00f0ff" stroke-width="4"/>

    <!-- Converging Perspective Lines to Horizon Center (960, 740) -->
    <line x1="960" y1="740" x2="960" y2="1080" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)"/>
    <line x1="960" y1="740" x2="820" y2="1080"/>
    <line x1="960" y1="740" x2="1100" y2="1080"/>
    <line x1="960" y1="740" x2="660" y2="1080"/>
    <line x1="960" y1="740" x2="1260" y2="1080"/>
    <line x1="960" y1="740" x2="480" y2="1080"/>
    <line x1="960" y1="740" x2="1440" y2="1080"/>
    <line x1="960" y1="740" x2="280" y2="1080"/>
    <line x1="960" y1="740" x2="1640" y2="1080"/>
    <line x1="960" y1="740" x2="60" y2="1080"/>
    <line x1="960" y1="740" x2="1860" y2="1080"/>
  </g>
</svg>
