<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky & Nebula Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07020d"/>
      <stop offset="45%" stop-color="#18052b"/>
      <stop offset="75%" stop-color="#3d0c4e"/>
      <stop offset="100%" stop-color="#6b1154"/>
    </linearGradient>

    <!-- Monumental Outrun Sun Gradient -->
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="45%" stop-color="#ff007f"/>
      <stop offset="70%" stop-color="#ff5400"/>
      <stop offset="100%" stop-color="#ffbe0b"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- TWINKLING STARS IN SKY -->
  <g fill="#ffbe0b" opacity="0.65">
    <rect x="120" y="80" width="3" height="3"/>
    <rect x="280" y="140" width="2" height="2"/>
    <rect x="420" y="60" width="4" height="4" fill="#00f0ff"/>
    <rect x="650" y="110" width="3" height="3"/>
    <rect x="850" y="50" width="2" height="2"/>
    <rect x="1050" y="90" width="4" height="4" fill="#ff007f"/>
    <rect x="1280" y="130" width="2" height="2"/>
    <rect x="1450" y="70" width="3" height="3"/>
    <rect x="1620" y="120" width="4" height="4" fill="#00f0ff"/>
    <rect x="1780" y="60" width="2" height="2"/>
    <rect x="200" y="220" width="3" height="3"/>
    <rect x="540" y="190" width="2" height="2"/>
    <rect x="1380" y="210" width="3" height="3" fill="#ffbe0b"/>
    <rect x="1720" y="180" width="2" height="2"/>
  </g>

  <!-- DISTANT JAGGED SYNTHWAVE MOUNTAIN RANGE -->
  <polygon points="0,680 180,560 340,630 520,520 700,610 880,500 1060,590 1240,490 1420,580 1600,510 1780,600 1920,530 1920,800 0,800" fill="#1b072b" opacity="0.8"/>
  <polygon points="0,720 140,620 300,680 480,590 660,670 840,580 1020,660 1200,570 1380,650 1560,580 1740,660 1920,600 1920,800 0,800" fill="#240a38" opacity="0.9"/>

  <!-- GIANT OUTRUN SUN ON HORIZON -->
  <g filter="url(#sunGlow)">
    <circle cx="960" cy="520" r="220" fill="url(#sunGrad)"/>
    <!-- Horizontal Blind Slices -->
    <rect x="700" y="470" width="520" height="6" fill="#18052b"/>
    <rect x="700" y="490" width="520" height="9" fill="#18052b"/>
    <rect x="700" y="515" width="520" height="14" fill="#18052b"/>
    <rect x="700" y="545" width="520" height="18" fill="#18052b"/>
    <rect x="700" y="580" width="520" height="24" fill="#18052b"/>
    <rect x="700" y="620" width="520" height="32" fill="#18052b"/>
    <rect x="700" y="670" width="520" height="42" fill="#18052b"/>
  </g>

  <!-- FAR SKYLINE SILHOUETTE (Dark Magenta/Plum) -->
  <g fill="#160524">
    <rect x="60" y="440" width="90" height="360"/>
    <polygon points="60,440 105,390 150,440"/>
    <line x1="105" y1="390" x2="105" y2="340" stroke="#ff007f" stroke-width="2"/>
    <circle cx="105" cy="340" r="3" fill="#ff007f"/>

    <rect x="200" y="410" width="110" height="390"/>
    <rect x="360" y="460" width="80" height="340"/>
    <rect x="490" y="380" width="130" height="420"/>
    <line x1="555" y1="380" x2="555" y2="310" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="555" cy="310" r="3" fill="#00f0ff"/>

    <rect x="670" y="450" width="100" height="350"/>
    <rect x="820" y="420" width="120" height="380"/>
    <rect x="990" y="390" width="110" height="410"/>
    <line x1="1045" y1="390" x2="1045" y2="330" stroke="#ff007f" stroke-width="2"/>
    <circle cx="1045" cy="330" r="3" fill="#ff007f"/>

    <rect x="1150" y="440" width="90" height="360"/>
    <rect x="1290" y="400" width="140" height="400"/>
    <line x1="1360" y1="400" x2="1360" y2="320" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="1360" cy="320" r="3" fill="#00f0ff"/>

    <rect x="1480" y="460" width="100" height="340"/>
    <rect x="1630" y="410" width="120" height="390"/>
    <rect x="1800" y="450" width="90" height="350"/>
  </g>

  <!-- MIDGROUND CYBERPUNK SKYLINE (Detailed Architecture with Antennas & Billboards) -->
  <g fill="#0e0217">
    <!-- Tower 1 -->
    <rect x="0" y="520" width="80" height="300"/>
    <!-- Tower 2 -->
    <rect x="100" y="470" width="120" height="350"/>
    <polygon points="100,470 160,430 220,470"/>
    <line x1="160" y1="430" x2="160" y2="370" stroke="#ff007f" stroke-width="3"/>
    <circle cx="160" cy="370" r="4" fill="#ff007f"/>
    <!-- Tower 3 -->
    <rect x="250" y="540" width="90" height="280"/>
    <!-- Tower 4 (Mega Spire) -->
    <rect x="370" y="450" width="140" height="370"/>
    <line x1="440" y1="450" x2="440" y2="360" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="440" cy="360" r="4" fill="#00f0ff"/>
    <!-- Skybridge between Tower 3 & 4 -->
    <rect x="340" y="580" width="30" height="12" fill="#1f0730"/>

    <!-- Tower 5 -->
    <rect x="540" y="500" width="110" height="320"/>
    <!-- Tower 6 -->
    <rect x="680" y="530" width="130" height="290"/>
    <!-- Tower 7 (Center Left Mega) -->
    <rect x="840" y="460" width="100" height="360"/>
    <polygon points="840,460 890,420 940,460"/>
    <!-- Tower 8 (Center Right Mega) -->
    <rect x="970" y="480" width="110" height="340"/>
    <!-- Tower 9 -->
    <rect x="1110" y="510" width="130" height="310"/>
    <line x1="1175" y1="510" x2="1175" y2="430" stroke="#ff007f" stroke-width="3"/>
    <circle cx="1175" cy="430" r="4" fill="#ff007f"/>

    <!-- Tower 10 -->
    <rect x="1270" y="460" width="120" height="360"/>
    <polygon points="1270,460 1330,410 1390,460"/>
    <!-- Skybridge between Tower 9 & 10 -->
    <rect x="1240" y="570" width="30" height="12" fill="#1f0730"/>

    <!-- Tower 11 -->
    <rect x="1420" y="530" width="110" height="290"/>
    <!-- Tower 12 (Right Mega Spire) -->
    <rect x="1560" y="470" width="130" height="350"/>
    <line x1="1625" y1="470" x2="1625" y2="390" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="1625" cy="390" r="4" fill="#00f0ff"/>
    <!-- Tower 13 -->
    <rect x="1720" y="520" width="100" height="300"/>
    <!-- Tower 14 -->
    <rect x="1840" y="490" width="80" height="330"/>
  </g>

  <!-- GLOWING NEON BILLBOARDS & ADS -->
  <g filter="url(#neonGlow)">
    <!-- Billboard 1: OTAQ -->
    <rect x="120" y="500" width="80" height="22" fill="#180424" stroke="#00f0ff" stroke-width="2"/>
    <text x="160" y="516" fill="#00f0ff" font-family="'Courier New', monospace" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="3">OTAQ.GG</text>

    <!-- Billboard 2: 8-BIT -->
    <rect x="390" y="480" width="100" height="26" fill="#180424" stroke="#ff007f" stroke-width="2"/>
    <text x="440" y="498" fill="#ff007f" font-family="'Courier New', monospace" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="4">8-BIT</text>

    <!-- Billboard 3: CHAOS -->
    <rect x="855" y="495" width="70" height="20" fill="#180424" stroke="#ffbe0b" stroke-width="2"/>
    <text x="890" y="510" fill="#ffbe0b" font-family="'Courier New', monospace" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="2">CHAOS</text>

    <!-- Billboard 4: CYBER JAPANESE KANJI -->
    <rect x="1300" y="485" width="60" height="30" fill="#180424" stroke="#00f0ff" stroke-width="2"/>
    <text x="1330" y="506" fill="#00f0ff" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">未来</text>

    <!-- Billboard 5: GLITCH -->
    <rect x="1580" y="500" width="90" height="24" fill="#180424" stroke="#ff007f" stroke-width="2"/>
    <text x="1625" y="517" fill="#ff007f" font-family="'Courier New', monospace" font-weight="900" font-size="13" text-anchor="middle" letter-spacing="3">NEO CITY</text>
  </g>

  <!-- GLOWING PIXEL WINDOWS MATRIX -->
  <g opacity="0.95">
    <!-- Tower 2 Windows -->
    <rect x="120" y="540" width="8" height="12" fill="#00f0ff"/>
    <rect x="140" y="540" width="8" height="12" fill="#ff007f"/>
    <rect x="160" y="540" width="8" height="12" fill="#ffbe0b"/>
    <rect x="180" y="540" width="8" height="12" fill="#00f0ff"/>
    <rect x="120" y="570" width="8" height="12" fill="#ff007f"/>
    <rect x="140" y="570" width="8" height="12" fill="#00f0ff"/>
    <rect x="160" y="570" width="8" height="12" fill="#00f0ff"/>
    <rect x="180" y="570" width="8" height="12" fill="#ffbe0b"/>
    <rect x="120" y="600" width="8" height="12" fill="#00f0ff"/>
    <rect x="160" y="600" width="8" height="12" fill="#ff007f"/>
    <rect x="180" y="600" width="8" height="12" fill="#00f0ff"/>

    <!-- Tower 4 Windows -->
    <rect x="390" y="530" width="10" height="14" fill="#ff007f"/>
    <rect x="415" y="530" width="10" height="14" fill="#00f0ff"/>
    <rect x="440" y="530" width="10" height="14" fill="#00f0ff"/>
    <rect x="465" y="530" width="10" height="14" fill="#ffbe0b"/>
    <rect x="390" y="560" width="10" height="14" fill="#00f0ff"/>
    <rect x="415" y="560" width="10" height="14" fill="#ffbe0b"/>
    <rect x="465" y="560" width="10" height="14" fill="#ff007f"/>
    <rect x="390" y="590" width="10" height="14" fill="#ff007f"/>
    <rect x="440" y="590" width="10" height="14" fill="#00f0ff"/>

    <!-- Tower 6 Windows -->
    <rect x="700" y="570" width="8" height="10" fill="#00f0ff"/>
    <rect x="720" y="570" width="8" height="10" fill="#ff007f"/>
    <rect x="740" y="570" width="8" height="10" fill="#ffbe0b"/>
    <rect x="760" y="570" width="8" height="10" fill="#00f0ff"/>
    <rect x="700" y="600" width="8" height="10" fill="#ff007f"/>
    <rect x="740" y="600" width="8" height="10" fill="#00f0ff"/>

    <!-- Tower 8 Windows -->
    <rect x="990" y="540" width="8" height="12" fill="#00f0ff"/>
    <rect x="1010" y="540" width="8" height="12" fill="#ffbe0b"/>
    <rect x="1030" y="540" width="8" height="12" fill="#ff007f"/>
    <rect x="1050" y="540" width="8" height="12" fill="#00f0ff"/>
    <rect x="990" y="570" width="8" height="12" fill="#ff007f"/>
    <rect x="1030" y="570" width="8" height="12" fill="#00f0ff"/>
    <rect x="1050" y="570" width="8" height="12" fill="#ffbe0b"/>

    <!-- Tower 10 Windows -->
    <rect x="1290" y="530" width="10" height="12" fill="#00f0ff"/>
    <rect x="1315" y="530" width="10" height="12" fill="#ff007f"/>
    <rect x="1340" y="530" width="10" height="12" fill="#00f0ff"/>
    <rect x="1365" y="530" width="10" height="12" fill="#ffbe0b"/>
    <rect x="1290" y="560" width="10" height="12" fill="#ffbe0b"/>
    <rect x="1340" y="560" width="10" height="12" fill="#ff007f"/>
    <rect x="1365" y="560" width="10" height="12" fill="#00f0ff"/>

    <!-- Tower 12 Windows -->
    <rect x="1580" y="540" width="10" height="14" fill="#ff007f"/>
    <rect x="1605" y="540" width="10" height="14" fill="#00f0ff"/>
    <rect x="1630" y="540" width="10" height="14" fill="#ffbe0b"/>
    <rect x="1655" y="540" width="10" height="14" fill="#00f0ff"/>
    <rect x="1580" y="570" width="10" height="14" fill="#00f0ff"/>
    <rect x="1630" y="570" width="10" height="14" fill="#ff007f"/>
    <rect x="1655" y="570" width="10" height="14" fill="#00f0ff"/>
  </g>

  <!-- FOREGROUND 3D PERSPECTIVE HORIZON GRID (Wireframe Road) -->
  <g stroke="#ff007f" stroke-width="2" opacity="0.65">
    <line x1="0" y1="780" x2="1920" y2="780" stroke="#00f0ff" stroke-width="4"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="0" y1="845" x2="1920" y2="845"/>
    <line x1="0" y1="885" x2="1920" y2="885"/>
    <line x1="0" y1="935" x2="1920" y2="935"/>
    <line x1="0" y1="995" x2="1920" y2="995"/>
    <line x1="0" y1="1070" x2="1920" y2="1070" stroke="#00f0ff" stroke-width="4"/>

    <!-- Vanishing Lines to Center Horizon (960, 780) -->
    <line x1="960" y1="780" x2="960" y2="1080" stroke="#00f0ff" stroke-width="3"/>
    <line x1="960" y1="780" x2="800" y2="1080"/>
    <line x1="960" y1="780" x2="1120" y2="1080"/>
    <line x1="960" y1="780" x2="620" y2="1080"/>
    <line x1="960" y1="780" x2="1300" y2="1080"/>
    <line x1="960" y1="780" x2="420" y2="1080"/>
    <line x1="960" y1="780" x2="1500" y2="1080"/>
    <line x1="960" y1="780" x2="200" y2="1080"/>
    <line x1="960" y1="780" x2="1720" y2="1080"/>
    <line x1="960" y1="780" x2="-60" y2="1080"/>
    <line x1="960" y1="780" x2="1980" y2="1080"/>
  </g>

  <!-- ATMOSPHERIC HORIZON PURPLE MIST -->
  <rect x="0" y="740" width="1920" height="80" fill="url(#sunGrad)" opacity="0.15"/>
</svg>
