<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="matSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010603"/>
      <stop offset="40%" stop-color="#031007"/>
      <stop offset="75%" stop-color="#061c0d"/>
      <stop offset="100%" stop-color="#0c2e17"/>
    </linearGradient>

    <!-- Matrix Green Glow -->
    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes blinkLed {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      .led-blink-1 { animation: blinkLed 1.2s infinite; }
      .led-blink-2 { animation: blinkLed 2.1s infinite 0.4s; }
      .led-blink-3 { animation: blinkLed 0.8s infinite 0.2s; }
    </style>
  </defs>

  <!-- SKY / VOID BACKGROUND -->
  <rect width="1920" height="1080" fill="url(#matSky)"/>

  <!-- SIDE SERVER MAINFRAME TOWERS (Left & Right Flanks) -->
  <g fill="#020a04" stroke="#0e3d1d" stroke-width="3">
    <!-- Left Server Tower 1 -->
    <rect x="20" y="240" width="160" height="560"/>
    <line x1="20" y1="320" x2="180" y2="320"/>
    <line x1="20" y1="400" x2="180" y2="400"/>
    <line x1="20" y1="480" x2="180" y2="480"/>
    <line x1="20" y1="560" x2="180" y2="560"/>
    <line x1="20" y1="640" x2="180" y2="640"/>
    <line x1="20" y1="720" x2="180" y2="720"/>

    <!-- Left Server Tower 2 -->
    <rect x="200" y="320" width="140" height="480"/>
    <line x1="200" y1="400" x2="340" y2="400"/>
    <line x1="200" y1="480" x2="340" y2="480"/>
    <line x1="200" y1="560" x2="340" y2="560"/>
    <line x1="200" y1="640" x2="340" y2="640"/>

    <!-- Right Server Tower 1 -->
    <rect x="1580" y="320" width="140" height="480"/>
    <line x1="1580" y1="400" x2="1720" y2="400"/>
    <line x1="1580" y1="480" x2="1720" y2="480"/>
    <line x1="1580" y1="560" x2="1720" y2="560"/>
    <line x1="1580" y1="640" x2="1720" y2="640"/>

    <!-- Right Server Tower 2 -->
    <rect x="1740" y="240" width="160" height="560"/>
    <line x1="1740" y1="320" x2="1900" y2="320"/>
    <line x1="1740" y1="400" x2="1900" y2="400"/>
    <line x1="1740" y1="480" x2="1900" y2="480"/>
    <line x1="1740" y1="560" x2="1900" y2="560"/>
    <line x1="1740" y1="640" x2="1900" y2="640"/>
    <line x1="1740" y1="720" x2="1900" y2="720"/>
  </g>

  <!-- SERVER STATUS LEDS -->
  <g filter="url(#matrixGlow)">
    <!-- Left LEDs -->
    <circle cx="40" cy="280" r="3" fill="#00ff88" class="led-blink-1"/>
    <circle cx="55" cy="280" r="3" fill="#00ff88" class="led-blink-2"/>
    <circle cx="70" cy="280" r="3" fill="#f59e0b" class="led-blink-3"/>
    <circle cx="40" cy="360" r="3" fill="#00ff88" class="led-blink-2"/>
    <circle cx="55" cy="360" r="3" fill="#10b981"/>
    <circle cx="40" cy="440" r="3" fill="#00ff88" class="led-blink-1"/>
    <circle cx="55" cy="440" r="3" fill="#00ff88"/>

    <circle cx="220" cy="360" r="3" fill="#00ff88" class="led-blink-3"/>
    <circle cx="235" cy="360" r="3" fill="#00ff88" class="led-blink-1"/>
    <circle cx="220" cy="440" r="3" fill="#f59e0b" class="led-blink-2"/>

    <!-- Right LEDs -->
    <circle cx="1600" cy="360" r="3" fill="#00ff88" class="led-blink-1"/>
    <circle cx="1615" cy="360" r="3" fill="#00ff88" class="led-blink-3"/>
    <circle cx="1600" cy="440" r="3" fill="#00ff88" class="led-blink-2"/>

    <circle cx="1760" cy="280" r="3" fill="#00ff88" class="led-blink-2"/>
    <circle cx="1775" cy="280" r="3" fill="#00ff88" class="led-blink-1"/>
    <circle cx="1790" cy="280" r="3" fill="#f59e0b" class="led-blink-3"/>
    <circle cx="1760" cy="360" r="3" fill="#00ff88" class="led-blink-1"/>
    <circle cx="1775" cy="360" r="3" fill="#10b981"/>
  </g>

  <!-- MOTHERBOARD CIRCUIT BUS TRACES LEADING TO CENTER PLATFORM -->
  <g stroke="#00ff88" stroke-width="2.5" fill="none" opacity="0.65" filter="url(#matrixGlow)">
    <!-- Left Bus Line to Center Platform -->
    <path d="M 180,480 L 380,480 L 460,560 L 720,560 L 800,640 L 800,740"/>
    <circle cx="380" cy="480" r="5" fill="#00ff88"/>
    <circle cx="460" cy="560" r="5" fill="#00ff88"/>
    <circle cx="800" cy="740" r="6" fill="#ffffff"/>

    <path d="M 340,600 L 500,600 L 580,680 L 840,680 L 880,720 L 880,760"/>
    <circle cx="500" cy="600" r="4" fill="#00ff88"/>
    <circle cx="880" cy="760" r="5" fill="#ffffff"/>

    <!-- Right Bus Line to Center Platform -->
    <path d="M 1740,480 L 1540,480 L 1460,560 L 1200,560 L 1120,640 L 1120,740"/>
    <circle cx="1540" cy="480" r="5" fill="#00ff88"/>
    <circle cx="1460" cy="560" r="5" fill="#00ff88"/>
    <circle cx="1120" cy="740" r="6" fill="#ffffff"/>

    <path d="M 1580,600 L 1420,600 L 1340,680 L 1080,680 L 1040,720 L 1040,760"/>
    <circle cx="1420" cy="600" r="4" fill="#00ff88"/>
    <circle cx="1040" cy="760" r="5" fill="#ffffff"/>
  </g>

  <!-- MULTI-TIER CASCADING MATRIX DIGITAL RAIN -->
  <g font-family="'Courier New', monospace" font-size="16" font-weight="900" letter-spacing="3">
    <!-- Stream 1 (Left Far) -->
    <g fill="#00ff88" opacity="0.4">
      <text x="370" y="80">0</text><text x="370" y="110">1</text><text x="370" y="140">X</text><text x="370" y="170">9</text><text x="370" y="200">A</text><text x="370" y="230">F</text><text x="370" y="260">3</text><text x="370" y="290">0</text><text x="370" y="320" fill="#ffffff" filter="url(#matrixGlow)">B</text>
    </g>
    <!-- Stream 2 (Left Mid) -->
    <g fill="#00ff88" opacity="0.6">
      <text x="490" y="160">7</text><text x="490" y="190">F</text><text x="490" y="220">3</text><text x="490" y="250">0</text><text x="490" y="280">C</text><text x="490" y="310">9</text><text x="490" y="340">1</text><text x="490" y="370">E</text><text x="490" y="400" fill="#ffffff" filter="url(#matrixGlow)">8</text>
    </g>
    <!-- Stream 3 (Left Center) -->
    <g fill="#00ff88" opacity="0.45">
      <text x="610" y="70">E</text><text x="610" y="100">8</text><text x="610" y="130">2</text><text x="610" y="160">B</text><text x="610" y="190">9</text><text x="610" y="220">0</text><text x="610" y="250" fill="#ffffff" filter="url(#matrixGlow)">F</text>
    </g>
    <!-- Stream 4 (Center Top Crest) -->
    <g fill="#00ff88" opacity="0.7">
      <text x="730" y="60">1</text><text x="730" y="90">0</text><text x="730" y="120">A</text><text x="730" y="150">5</text><text x="730" y="180">F</text><text x="730" y="210">2</text><text x="730" y="240">9</text><text x="730" y="270" fill="#ffffff" filter="url(#matrixGlow)">D</text>
    </g>
    <!-- Stream 5 (Center Right Crest) -->
    <g fill="#00ff88" opacity="0.7">
      <text x="1190" y="60">D</text><text x="1190" y="90">3</text><text x="1190" y="120">6</text><text x="1190" y="150">1</text><text x="1190" y="180">8</text><text x="1190" y="210">C</text><text x="1190" y="240">0</text><text x="1190" y="270" fill="#ffffff" filter="url(#matrixGlow)">A</text>
    </g>
    <!-- Stream 6 (Right Center) -->
    <g fill="#00ff88" opacity="0.45">
      <text x="1310" y="90">8</text><text x="1310" y="120">C</text><text x="1310" y="150">0</text><text x="1310" y="180">9</text><text x="1310" y="210">B</text><text x="1310" y="240">7</text><text x="1310" y="270" fill="#ffffff" filter="url(#matrixGlow)">E</text>
    </g>
    <!-- Stream 7 (Right Mid) -->
    <g fill="#00ff88" opacity="0.6">
      <text x="1430" y="150">5</text><text x="1430" y="180">1</text><text x="1430" y="210">E</text><text x="1430" y="240">F</text><text x="1430" y="270">2</text><text x="1430" y="300">8</text><text x="1430" y="330">4</text><text x="1430" y="360">A</text><text x="1430" y="390" fill="#ffffff" filter="url(#matrixGlow)">0</text>
    </g>
    <!-- Stream 8 (Right Far) -->
    <g fill="#00ff88" opacity="0.4">
      <text x="1550" y="70">A</text><text x="1550" y="100">9</text><text x="1550" y="130">F</text><text x="1550" y="160">3</text><text x="1550" y="190">0</text><text x="1550" y="220">B</text><text x="1550" y="250" fill="#ffffff" filter="url(#matrixGlow)">1</text>
    </g>
  </g>

  <!-- 3D PHOSPHOR WIREFRAME FLOOR GRID -->
  <g stroke="#00ff88" stroke-width="2" opacity="0.65">
    <line x1="0" y1="740" x2="1920" y2="740" stroke="#e6fffa" stroke-width="4" filter="url(#matrixGlow)"/>
    <line x1="0" y1="770" x2="1920" y2="770"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="0" y1="860" x2="1920" y2="860"/>
    <line x1="0" y1="920" x2="1920" y2="920"/>
    <line x1="0" y1="995" x2="1920" y2="995"/>
    <line x1="0" y1="1080" x2="1920" y2="1080" stroke="#e6fffa" stroke-width="5"/>

    <!-- Vanishing Lines to Center (960, 740) -->
    <line x1="960" y1="740" x2="960" y2="1080" stroke="#e6fffa" stroke-width="3" filter="url(#matrixGlow)"/>
    <line x1="960" y1="740" x2="800" y2="1080"/>
    <line x1="960" y1="740" x2="1120" y2="1080"/>
    <line x1="960" y1="740" x2="620" y2="1080"/>
    <line x1="960" y1="740" x2="1300" y2="1080"/>
    <line x1="960" y1="740" x2="420" y2="1080"/>
    <line x1="960" y1="740" x2="1500" y2="1080"/>
    <line x1="960" y1="740" x2="200" y2="1080"/>
    <line x1="960" y1="740" x2="1720" y2="1080"/>
    <line x1="960" y1="740" x2="-80" y2="1080"/>
    <line x1="960" y1="740" x2="2000" y2="1080"/>
  </g>
</svg>
