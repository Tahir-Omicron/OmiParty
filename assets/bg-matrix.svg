<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="matSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020804"/>
      <stop offset="60%" stop-color="#051409"/>
      <stop offset="100%" stop-color="#0a2612"/>
    </linearGradient>

    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND VOID -->
  <rect width="1920" height="1080" fill="url(#matSky)"/>

  <!-- PRINTED CIRCUIT BOARD (PCB) TRACES IN BACKGROUND -->
  <g stroke="#0e3d1d" stroke-width="2" fill="none" opacity="0.4">
    <!-- Left Circuit Node -->
    <path d="M 0,200 L 180,200 L 260,280 L 380,280 L 420,320 L 420,450"/>
    <circle cx="260" cy="280" r="4" fill="#00ff88"/>
    <circle cx="420" cy="450" r="4" fill="#00ff88"/>
    <path d="M 50,0 L 50,150 L 120,220 L 120,380 L 180,440 L 300,440"/>
    <circle cx="120" cy="220" r="4" fill="#10b981"/>

    <!-- Right Circuit Node -->
    <path d="M 1920,200 L 1740,200 L 1660,280 L 1540,280 L 1500,320 L 1500,450"/>
    <circle cx="1660" cy="280" r="4" fill="#00ff88"/>
    <circle cx="1500" cy="450" r="4" fill="#00ff88"/>
    <path d="M 1870,0 L 1870,150 L 1800,220 L 1800,380 L 1740,440 L 1620,440"/>
    <circle cx="1800" cy="220" r="4" fill="#10b981"/>

    <!-- Center Chip Dies -->
    <rect x="150" y="550" width="80" height="80" stroke="#00ff88" stroke-width="2"/>
    <text x="190" y="595" fill="#00ff88" font-family="monospace" font-size="12" text-anchor="middle">CPU_01</text>
    <rect x="1690" y="550" width="80" height="80" stroke="#00ff88" stroke-width="2"/>
    <text x="1730" y="595" fill="#00ff88" font-family="monospace" font-size="12" text-anchor="middle">GPU_89</text>
  </g>

  <!-- MULTI-COLUMN DIGITAL MATRIX RAIN STREAMS -->
  <g font-family="'Courier New', monospace" font-size="15" font-weight="900" letter-spacing="2">
    <!-- Stream 1 -->
    <g fill="#00ff88" opacity="0.35">
      <text x="80" y="60">0</text><text x="80" y="85">1</text><text x="80" y="110">X</text><text x="80" y="135">9</text><text x="80" y="160">A</text><text x="80" y="185">F</text><text x="80" y="210">3</text><text x="80" y="235">0</text><text x="80" y="260" fill="#ffffff" filter="url(#matrixGlow)">B</text>
    </g>
    <!-- Stream 2 -->
    <g fill="#00ff88" opacity="0.45">
      <text x="160" y="180">7</text><text x="160" y="205">F</text><text x="160" y="230">3</text><text x="160" y="255">0</text><text x="160" y="280">C</text><text x="160" y="305">9</text><text x="160" y="330">1</text><text x="160" y="355">E</text><text x="160" y="380" fill="#ffffff" filter="url(#matrixGlow)">8</text>
    </g>
    <!-- Stream 3 -->
    <g fill="#00ff88" opacity="0.3">
      <text x="240" y="80">E</text><text x="240" y="105">8</text><text x="240" y="130">2</text><text x="240" y="155">B</text><text x="240" y="180">9</text><text x="240" y="205">0</text><text x="240" y="230" fill="#ffffff" filter="url(#matrixGlow)">F</text>
    </g>
    <!-- Stream 4 -->
    <g fill="#00ff88" opacity="0.5">
      <text x="320" y="240">1</text><text x="320" y="265">0</text><text x="320" y="290">A</text><text x="320" y="315">5</text><text x="320" y="340">F</text><text x="320" y="365">2</text><text x="320" y="390">9</text><text x="320" y="415">D</text><text x="320" y="440" fill="#ffffff" filter="url(#matrixGlow)">4</text>
    </g>
    <!-- Stream 5 -->
    <g fill="#00ff88" opacity="0.35">
      <text x="400" y="100">D</text><text x="400" y="125">3</text><text x="400" y="150">6</text><text x="400" y="175">1</text><text x="400" y="200">8</text><text x="400" y="225">C</text><text x="400" y="250" fill="#ffffff" filter="url(#matrixGlow)">0</text>
    </g>
    <!-- Stream 6 -->
    <g fill="#00ff88" opacity="0.45">
      <text x="480" y="190">8</text><text x="480" y="215">C</text><text x="480" y="240">0</text><text x="480" y="265">9</text><text x="480" y="290">B</text><text x="480" y="315">7</text><text x="480" y="340">4</text><text x="480" y="365" fill="#ffffff" filter="url(#matrixGlow)">E</text>
    </g>
    <!-- Stream 7 -->
    <g fill="#00ff88" opacity="0.3">
      <text x="560" y="70">5</text><text x="560" y="95">1</text><text x="560" y="120">E</text><text x="560" y="145">F</text><text x="560" y="170">2</text><text x="560" y="195">8</text><text x="560" y="220" fill="#ffffff" filter="url(#matrixGlow)">A</text>
    </g>

    <!-- RIGHT WING STREAMS -->
    <!-- Stream 8 -->
    <g fill="#00ff88" opacity="0.35">
      <text x="1360" y="80">A</text><text x="1360" y="105">9</text><text x="1360" y="130">F</text><text x="1360" y="155">3</text><text x="1360" y="180">0</text><text x="1360" y="205">B</text><text x="1360" y="230" fill="#ffffff" filter="url(#matrixGlow)">1</text>
    </g>
    <!-- Stream 9 -->
    <g fill="#00ff88" opacity="0.45">
      <text x="1440" y="200">2</text><text x="1440" y="225">8</text><text x="1440" y="250">C</text><text x="1440" y="275">0</text><text x="1440" y="300">9</text><text x="1440" y="325">E</text><text x="1440" y="350">7</text><text x="1440" y="375" fill="#ffffff" filter="url(#matrixGlow)">F</text>
    </g>
    <!-- Stream 10 -->
    <g fill="#00ff88" opacity="0.3">
      <text x="1520" y="110">6</text><text x="1520" y="135">1</text><text x="1520" y="160">8</text><text x="1520" y="185">D</text><text x="1520" y="210">4</text><text x="1520" y="235" fill="#ffffff" filter="url(#matrixGlow)">0</text>
    </g>
    <!-- Stream 11 -->
    <g fill="#00ff88" opacity="0.5">
      <text x="1600" y="160">0</text><text x="1600" y="185">A</text><text x="1600" y="210">5</text><text x="1600" y="235">F</text><text x="1600" y="260">2</text><text x="1600" y="285">9</text><text x="1600" y="310">B</text><text x="1600" y="335" fill="#ffffff" filter="url(#matrixGlow)">3</text>
    </g>
    <!-- Stream 12 -->
    <g fill="#00ff88" opacity="0.35">
      <text x="1680" y="90">7</text><text x="1680" y="115">F</text><text x="1680" y="140">3</text><text x="1680" y="165">0</text><text x="1680" y="190">C</text><text x="1680" y="215" fill="#ffffff" filter="url(#matrixGlow)">8</text>
    </g>
    <!-- Stream 13 -->
    <g fill="#00ff88" opacity="0.45">
      <text x="1760" y="220">E</text><text x="1760" y="245">8</text><text x="1760" y="270">2</text><text x="1760" y="295">B</text><text x="1760" y="320">9</text><text x="1760" y="345">0</text><text x="1760" y="370">4</text><text x="1760" y="395" fill="#ffffff" filter="url(#matrixGlow)">A</text>
    </g>
    <!-- Stream 14 -->
    <g fill="#00ff88" opacity="0.3">
      <text x="1840" y="120">1</text><text x="1840" y="145">0</text><text x="1840" y="170">A</text><text x="1840" y="195">5</text><text x="1840" y="220">F</text><text x="1840" y="245" fill="#ffffff" filter="url(#matrixGlow)">6</text>
    </g>
  </g>

  <!-- 3D MATRIX PHOSPHOR HORIZON GRID -->
  <g stroke="#00ff88" stroke-width="2" opacity="0.5">
    <line x1="0" y1="800" x2="1920" y2="800" stroke="#e6fffa" stroke-width="3"/>
    <line x1="0" y1="830" x2="1920" y2="830"/>
    <line x1="0" y1="865" x2="1920" y2="865"/>
    <line x1="0" y1="905" x2="1920" y2="905"/>
    <line x1="0" y1="955" x2="1920" y2="955"/>
    <line x1="0" y1="1015" x2="1920" y2="1015"/>
    <line x1="0" y1="1080" x2="1920" y2="1080" stroke="#e6fffa" stroke-width="4"/>

    <!-- Vanishing Lines to Center Horizon (960, 800) -->
    <line x1="960" y1="800" x2="960" y2="1080" stroke="#e6fffa" stroke-width="2"/>
    <line x1="960" y1="800" x2="820" y2="1080"/>
    <line x1="960" y1="800" x2="1100" y2="1080"/>
    <line x1="960" y1="800" x2="660" y2="1080"/>
    <line x1="960" y1="800" x2="1260" y2="1080"/>
    <line x1="960" y1="800" x2="480" y2="1080"/>
    <line x1="960" y1="800" x2="1440" y2="1080"/>
    <line x1="960" y1="800" x2="280" y2="1080"/>
    <line x1="960" y1="800" x2="1640" y2="1080"/>
    <line x1="960" y1="800" x2="60" y2="1080"/>
    <line x1="960" y1="800" x2="1860" y2="1080"/>
  </g>
</svg>
