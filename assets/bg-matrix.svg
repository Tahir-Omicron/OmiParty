<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark Emerald Terminal Gradient -->
    <linearGradient id="matSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010603"/>
      <stop offset="40%" stop-color="#031207"/>
      <stop offset="75%" stop-color="#06200d"/>
      <stop offset="100%" stop-color="#0b3316"/>
    </linearGradient>

    <!-- Matrix Green Glow -->
    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- SKY / VOID BACKGROUND -->
  <rect width="1920" height="1080" fill="url(#matSky)"/>

  <!-- SIDE SERVER MAINFRAME TOWERS -->
  <g fill="#020a04" stroke="#0e3d1d" stroke-width="2.5">
    <!-- Left Server Tower -->
    <rect x="30" y="260" width="150" height="520"/>
    <line x1="30" y1="340" x2="180" y2="340"/>
    <line x1="30" y1="420" x2="180" y2="420"/>
    <line x1="30" y1="500" x2="180" y2="500"/>
    <line x1="30" y1="580" x2="180" y2="580"/>
    <line x1="30" y1="660" x2="180" y2="660"/>

    <!-- Right Server Tower -->
    <rect x="1740" y="260" width="150" height="520"/>
    <line x1="1740" y1="340" x2="1890" y2="340"/>
    <line x1="1740" y1="420" x2="1890" y2="420"/>
    <line x1="1740" y1="500" x2="1890" y2="500"/>
    <line x1="1740" y1="580" x2="1890" y2="580"/>
    <line x1="1740" y1="660" x2="1890" y2="660"/>
  </g>

  <!-- SERVER STATUS LEDS (Stationary & Clean) -->
  <g filter="url(#matrixGlow)">
    <circle cx="50" cy="300" r="3" fill="#00ff88"/>
    <circle cx="65" cy="300" r="3" fill="#00ff88"/>
    <circle cx="80" cy="300" r="3" fill="#f59e0b"/>
    <circle cx="50" cy="380" r="3" fill="#00ff88"/>
    <circle cx="65" cy="380" r="3" fill="#10b981"/>

    <circle cx="1760" cy="300" r="3" fill="#00ff88"/>
    <circle cx="1775" cy="300" r="3" fill="#00ff88"/>
    <circle cx="1790" cy="300" r="3" fill="#f59e0b"/>
    <circle cx="1760" cy="380" r="3" fill="#00ff88"/>
  </g>

  <!-- MOTHERBOARD CIRCUIT BUS TRACES (Stationary & Clean) -->
  <g stroke="#00ff88" stroke-width="2" fill="none" opacity="0.6" filter="url(#matrixGlow)">
    <path d="M 180,480 L 380,480 L 460,560 L 720,560 L 800,640 L 800,740"/>
    <circle cx="380" cy="480" r="4" fill="#00ff88"/>
    <circle cx="460" cy="560" r="4" fill="#00ff88"/>
    <circle cx="800" cy="740" r="5" fill="#ffffff"/>

    <path d="M 1740,480 L 1540,480 L 1460,560 L 1200,560 L 1120,640 L 1120,740"/>
    <circle cx="1540" cy="480" r="4" fill="#00ff88"/>
    <circle cx="1460" cy="560" r="4" fill="#00ff88"/>
    <circle cx="1120" cy="740" r="5" fill="#ffffff"/>
  </g>

  <!-- STATIONARY MATRIX DIGITAL RAIN STREAMS -->
  <g font-family="'Courier New', monospace" font-size="16" font-weight="900" letter-spacing="3">
    <!-- Stream Left 1 -->
    <g fill="#00ff88" opacity="0.35">
      <text x="360" y="80">0</text><text x="360" y="110">1</text><text x="360" y="140">X</text><text x="360" y="170">9</text><text x="360" y="200">A</text><text x="360" y="230">F</text><text x="360" y="260" fill="#ffffff" filter="url(#matrixGlow)">B</text>
    </g>
    <!-- Stream Left 2 -->
    <g fill="#00ff88" opacity="0.55">
      <text x="500" y="140">7</text><text x="500" y="170">F</text><text x="500" y="200">3</text><text x="500" y="230">0</text><text x="500" y="260">C</text><text x="500" y="290">9</text><text x="500" y="320" fill="#ffffff" filter="url(#matrixGlow)">8</text>
    </g>
    <!-- Stream Left 3 -->
    <g fill="#00ff88" opacity="0.45">
      <text x="640" y="60">E</text><text x="640" y="90">8</text><text x="640" y="120">2</text><text x="640" y="150">B</text><text x="640" y="180">9</text><text x="640" y="210" fill="#ffffff" filter="url(#matrixGlow)">F</text>
    </g>
    <!-- Stream Right 1 -->
    <g fill="#00ff88" opacity="0.45">
      <text x="1280" y="60">D</text><text x="1280" y="90">3</text><text x="1280" y="120">6</text><text x="1280" y="150">1</text><text x="1280" y="180">8</text><text x="1280" y="210" fill="#ffffff" filter="url(#matrixGlow)">A</text>
    </g>
    <!-- Stream Right 2 -->
    <g fill="#00ff88" opacity="0.55">
      <text x="1420" y="130">5</text><text x="1420" y="160">1</text><text x="1420" y="190">E</text><text x="1420" y="220">F</text><text x="1420" y="250">2</text><text x="1420" y="280">8</text><text x="1420" y="310" fill="#ffffff" filter="url(#matrixGlow)">0</text>
    </g>
    <!-- Stream Right 3 -->
    <g fill="#00ff88" opacity="0.35">
      <text x="1560" y="70">A</text><text x="1560" y="100">9</text><text x="1560" y="130">F</text><text x="1560" y="160">3</text><text x="1560" y="190">0</text><text x="1560" y="220" fill="#ffffff" filter="url(#matrixGlow)">1</text>
    </g>
  </g>

  <!-- 3D PHOSPHOR WIREFRAME FLOOR GRID (Stationary) -->
  <g stroke="#00ff88" stroke-width="2" opacity="0.65">
    <line x1="0" y1="740" x2="1920" y2="740" stroke="#e6fffa" stroke-width="4" filter="url(#matrixGlow)"/>
    <line x1="0" y1="770" x2="1920" y2="770"/>
    <line x1="0" y1="805" x2="1920" y2="805"/>
    <line x1="0" y1="845" x2="1920" y2="845"/>
    <line x1="0" y1="895" x2="1920" y2="895"/>
    <line x1="0" y1="955" x2="1920" y2="955"/>
    <line x1="0" y1="1025" x2="1920" y2="1025"/>
    <line x1="0" y1="1080" x2="1920" y2="1080" stroke="#e6fffa" stroke-width="5"/>

    <!-- Vanishing Lines to Center (960, 740) -->
    <line x1="960" y1="740" x2="960" y2="1080" stroke="#e6fffa" stroke-width="3" filter="url(#matrixGlow)"/>
    <line x1="960" y1="740" x2="820" y2="1080"/>
    <line x1="960" y1="740" x2="1100" y2="1080"/>
    <line x1="960" y1="740" x2="660" y2="1080"/>
    <line x1="960" y1="740" x2="1260" y2="1080"/>
    <line x1="960" y1="740" x2="480" y2="1080"/>
    <line x1="960" y1="740" x2="1440" y2="1080"/>
    <line x1="960" y1="740" x2="280" y2="1080"/>
    <line x1="960" y1="740" x2="1640" y2="1080"/>
    <line x1="960" y1="740" x2="60" y2="1080"/>
    <line x1="960" y1="740" x2="1860" y2="1080"/>
  </g>
</svg>
