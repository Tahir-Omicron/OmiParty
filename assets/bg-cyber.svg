<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cyberSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030610"/>
      <stop offset="55%" stop-color="#0a1224"/>
      <stop offset="85%" stop-color="#141a38"/>
      <stop offset="100%" stop-color="#1e1845"/>
    </linearGradient>

    <!-- Nebula Cloud Gradient -->
    <radialGradient id="nebulaCyan" cx="30%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030610" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaPurple" cx="75%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030610" stop-opacity="0"/>
    </radialGradient>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="1920" height="1080" fill="url(#cyberSky)"/>

  <!-- NEBULA GAS CLOUDS -->
  <rect width="1920" height="1080" fill="url(#nebulaCyan)"/>
  <rect width="1920" height="1080" fill="url(#nebulaPurple)"/>

  <!-- 8-BIT DIAMOND SPARKLE STARS -->
  <g fill="#ffffff" filter="url(#starGlow)">
    <!-- Major Diamond Stars -->
    <polygon points="240,120 244,124 240,128 236,124" fill="#00ffcc"/>
    <polygon points="480,90 485,95 480,100 475,95" fill="#a855f7"/>
    <polygon points="760,160 766,166 760,172 754,166" fill="#00ffcc"/>
    <polygon points="1120,110 1125,115 1120,120 1115,115" fill="#ffffff"/>
    <polygon points="1440,80 1446,86 1440,92 1434,86" fill="#00ffcc"/>
    <polygon points="1720,140 1725,145 1720,150 1715,145" fill="#a855f7"/>

    <polygon points="180,320 184,324 180,328 176,324" fill="#ffffff"/>
    <polygon points="560,260 565,265 560,270 555,265" fill="#00ffcc"/>
    <polygon points="1380,280 1385,285 1380,290 1375,285" fill="#a855f7"/>
    <polygon points="1660,340 1664,344 1660,348 1656,344" fill="#00ffcc"/>
  </g>

  <!-- DENSE 8-BIT STARFIELD -->
  <g fill="#94a3b8" opacity="0.65">
    <rect x="90" y="60" width="2" height="2"/>
    <rect x="150" y="180" width="3" height="3" fill="#00ffcc"/>
    <rect x="310" y="90" width="2" height="2"/>
    <rect x="380" y="210" width="3" height="3"/>
    <rect x="620" y="70" width="2" height="2"/>
    <rect x="690" y="130" width="3" height="3" fill="#a855f7"/>
    <rect x="880" y="90" width="2" height="2"/>
    <rect x="980" y="190" width="3" height="3"/>
    <rect x="1040" y="60" width="2" height="2"/>
    <rect x="1220" y="150" width="3" height="3" fill="#00ffcc"/>
    <rect x="1310" y="90" width="2" height="2"/>
    <rect x="1530" y="180" width="3" height="3"/>
    <rect x="1590" y="60" width="2" height="2"/>
    <rect x="1800" y="100" width="3" height="3" fill="#a855f7"/>
    <rect x="1870" y="220" width="2" height="2"/>
  </g>

  <!-- PIXEL CONSTELLATION LINES -->
  <g stroke="#00ffcc" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.35">
    <!-- Left Celestial Gamepad Constellation -->
    <polyline points="240,120 310,180 380,210 480,90 380,60 240,120"/>
    <circle cx="310" cy="180" r="3" fill="#00ffcc"/>
    <circle cx="380" cy="60" r="3" fill="#00ffcc"/>

    <!-- Right Dragon Constellation -->
    <polyline points="1440,80 1530,140 1660,120 1720,140 1660,220 1530,180"/>
    <circle cx="1530" cy="140" r="3" fill="#a855f7"/>
    <circle cx="1660" cy="220" r="3" fill="#a855f7"/>
  </g>

  <!-- 3D CYBER HORIZON WIREFRAME GRID -->
  <g stroke="#00ffcc" stroke-width="2" opacity="0.5">
    <line x1="0" y1="780" x2="1920" y2="780" stroke="#a855f7" stroke-width="3"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="0" y1="845" x2="1920" y2="845"/>
    <line x1="0" y1="885" x2="1920" y2="885"/>
    <line x1="0" y1="935" x2="1920" y2="935"/>
    <line x1="0" y1="995" x2="1920" y2="995"/>
    <line x1="0" y1="1070" x2="1920" y2="1070" stroke="#a855f7" stroke-width="4"/>

    <!-- Vanishing Lines to Center Horizon (960, 780) -->
    <line x1="960" y1="780" x2="960" y2="1080" stroke="#a855f7" stroke-width="2"/>
    <line x1="960" y1="780" x2="800" y2="1080"/>
    <line x1="960" y1="780" x2="1120" y2="1080"/>
    <line x1="960" y1="780" x2="620" y2="1080"/>
    <line x1="960" y1="780" x2="1300" y2="1080"/>
    <line x1="960" y1="780" x2="420" y2="1080"/>
    <line x1="960" y1="780" x2="1500" y2="1080"/>
    <line x1="960" y1="780" x2="200" y2="1080"/>
    <line x1="960" y1="780" x2="1720" y2="1080"/>
    <line x1="960" y1="780" x2="-60" y2="1080"/>
    <line x1="960" y1="780" x2="1980" y2="1080"/>
  </g>
</svg>
