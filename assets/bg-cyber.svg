<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cyberSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="35%" stop-color="#070c1a"/>
      <stop offset="70%" stop-color="#101833"/>
      <stop offset="100%" stop-color="#1b123d"/>
    </linearGradient>

    <!-- Nebula Cloud Gradients -->
    <radialGradient id="nebulaCyan" cx="25%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaPurple" cx="80%" cy="25%" r="48%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>

    <filter id="starGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="1920" height="1080" fill="url(#cyberSky)"/>

  <!-- NEBULA GAS CLOUDS -->
  <rect width="1920" height="1080" fill="url(#nebulaCyan)"/>
  <rect width="1920" height="1080" fill="url(#nebulaPurple)"/>

  <!-- 8-BIT DIAMOND SPARKLE STARS -->
  <g fill="#ffffff" filter="url(#starGlow)">
    <!-- Major Diamond Stars -->
    <polygon points="200,90 206,96 200,102 194,96" fill="#00ffcc"/>
    <polygon points="440,70 447,77 440,84 433,77" fill="#a855f7"/>
    <polygon points="720,130 728,138 720,146 712,138" fill="#00ffcc"/>
    <polygon points="960,80 967,87 960,94 953,87" fill="#ffffff"/>
    <polygon points="1200,110 1208,118 1200,126 1192,118" fill="#00ffcc"/>
    <polygon points="1480,60 1488,68 1480,76 1472,68" fill="#a855f7"/>
    <polygon points="1760,110 1767,117 1760,124 1753,117" fill="#00ffcc"/>

    <polygon points="150,280 156,286 150,292 144,286" fill="#ffffff"/>
    <polygon points="520,220 527,227 520,234 513,227" fill="#00ffcc"/>
    <polygon points="1420,240 1427,247 1420,254 1413,247" fill="#a855f7"/>
    <polygon points="1700,300 1706,306 1700,312 1694,306" fill="#00ffcc"/>
  </g>

  <!-- DENSE 8-BIT STARFIELD -->
  <g fill="#94a3b8" opacity="0.75">
    <rect x="70" y="50" width="3" height="3"/>
    <rect x="130" y="160" width="4" height="4" fill="#00ffcc"/>
    <rect x="290" y="80" width="3" height="3"/>
    <rect x="360" y="190" width="4" height="4"/>
    <rect x="580" y="60" width="3" height="3"/>
    <rect x="650" y="120" width="4" height="4" fill="#a855f7"/>
    <rect x="840" y="80" width="3" height="3"/>
    <rect x="1080" y="160" width="4" height="4"/>
    <rect x="1270" y="50" width="3" height="3"/>
    <rect x="1360" y="140" width="4" height="4" fill="#00ffcc"/>
    <rect x="1590" y="80" width="3" height="3"/>
    <rect x="1660" y="170" width="4" height="4"/>
    <rect x="1840" y="90" width="4" height="4" fill="#a855f7"/>
  </g>

  <!-- PIXEL CONSTELLATION LINES -->
  <g stroke="#00ffcc" stroke-width="2" stroke-dasharray="6,6" fill="none" opacity="0.45" filter="url(#starGlow)">
    <!-- Left Celestial Gamepad Constellation -->
    <polyline points="200,90 280,160 360,190 440,70 360,40 200,90"/>
    <circle cx="280" cy="160" r="4" fill="#00ffcc"/>
    <circle cx="360" cy="40" r="4" fill="#00ffcc"/>

    <!-- Right Phoenix Constellation -->
    <polyline points="1480,60 1560,130 1700,110 1760,110 1700,200 1560,160"/>
    <circle cx="1560" cy="130" r="4" fill="#a855f7"/>
    <circle cx="1700" cy="200" r="4" fill="#a855f7"/>
  </g>

  <!-- 3D CYBER HORIZON WIREFRAME GRID -->
  <g stroke="#00ffcc" stroke-width="2" opacity="0.6">
    <line x1="0" y1="720" x2="1920" y2="720" stroke="#a855f7" stroke-width="5" filter="url(#starGlow)"/>
    <line x1="0" y1="750" x2="1920" y2="750"/>
    <line x1="0" y1="785" x2="1920" y2="785"/>
    <line x1="0" y1="825" x2="1920" y2="825"/>
    <line x1="0" y1="875" x2="1920" y2="875"/>
    <line x1="0" y1="935" x2="1920" y2="935"/>
    <line x1="0" y1="1005" x2="1920" y2="1005"/>
    <line x1="0" y1="1080" x2="1920" y2="1080" stroke="#a855f7" stroke-width="5"/>

    <!-- Vanishing Lines to Center Horizon (960, 720) -->
    <line x1="960" y1="720" x2="960" y2="1080" stroke="#a855f7" stroke-width="3" filter="url(#starGlow)"/>
    <line x1="960" y1="720" x2="800" y2="1080"/>
    <line x1="960" y1="720" x2="1120" y2="1080"/>
    <line x1="960" y1="720" x2="620" y2="1080"/>
    <line x1="960" y1="720" x2="1300" y2="1080"/>
    <line x1="960" y1="720" x2="420" y2="1080"/>
    <line x1="960" y1="720" x2="1500" y2="1080"/>
    <line x1="960" y1="720" x2="200" y2="1080"/>
    <line x1="960" y1="720" x2="1720" y2="1080"/>
    <line x1="960" y1="720" x2="-80" y2="1080"/>
    <line x1="960" y1="720" x2="2000" y2="1080"/>
  </g>
</svg>
