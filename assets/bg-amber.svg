<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="amberSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050200"/>
      <stop offset="40%" stop-color="#120600"/>
      <stop offset="75%" stop-color="#220b00"/>
      <stop offset="100%" stop-color="#361300"/>
    </linearGradient>

    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .radar-sweep-arm {
        transform-origin: 960px 360px;
        animation: radarSweep 8s linear infinite;
      }
    </style>
  </defs>

  <!-- BACKGROUND VOID -->
  <rect width="1920" height="1080" fill="url(#amberSky)"/>

  <!-- TWINKLING AMBER TELEMETRY STARS -->
  <g fill="#ffb000" opacity="0.6">
    <rect x="100" y="50" width="3" height="3"/>
    <rect x="220" y="110" width="2" height="2"/>
    <rect x="360" y="70" width="4" height="4" filter="url(#amberGlow)"/>
    <rect x="540" y="130" width="3" height="3"/>
    <rect x="720" y="60" width="2" height="2"/>
    <rect x="1200" y="60" width="3" height="3"/>
    <rect x="1380" y="110" width="4" height="4" filter="url(#amberGlow)"/>
    <rect x="1560" y="70" width="2" height="2"/>
    <rect x="1740" y="120" width="3" height="3"/>
    <rect x="1860" y="50" width="2" height="2"/>
  </g>

  <!-- ELEVATED RADAR OBSERVATORY DISPLAY (Center Crest) -->
  <g stroke="#ffb000" fill="none" opacity="0.45" filter="url(#amberGlow)">
    <circle cx="960" cy="360" r="100" stroke-width="1.5"/>
    <circle cx="960" cy="360" r="200" stroke-width="1.5" stroke-dasharray="8,8"/>
    <circle cx="960" cy="360" r="300" stroke-width="2"/>
    <circle cx="960" cy="360" r="400" stroke-width="1.5" stroke-dasharray="4,8"/>

    <!-- Crosshairs & Azimuth Axes -->
    <line x1="520" y1="360" x2="1400" y2="360" stroke-width="2"/>
    <line x1="960" y1="0" x2="960" y2="720" stroke-width="2"/>

    <!-- Planetary Orbits -->
    <ellipse cx="960" cy="360" rx="360" ry="150" stroke="#ffd000" stroke-width="1.5" stroke-dasharray="6,6"/>
    <circle cx="1220" cy="360" r="7" fill="#ffb000"/>
    <circle cx="800" cy="310" r="5" fill="#ff5500"/>
  </g>

  <!-- SWEEPING RADAR BEAM ARM -->
  <g class="radar-sweep-arm" opacity="0.35">
    <line x1="960" y1="360" x2="960" y2="60" stroke="#ffd000" stroke-width="3" filter="url(#amberGlow)"/>
    <polygon points="960,360 960,60 1060,60" fill="#ffb000" opacity="0.2"/>
  </g>

  <!-- LEFT WING: TAPE REEL & OSCILLOSCOPE CONSOLE -->
  <g fill="#140600" stroke="#ffb000" stroke-width="2" opacity="0.8">
    <rect x="60" y="240" width="280" height="200"/>
    <!-- Tape Reels -->
    <circle cx="130" cy="320" r="40" fill="#080200"/>
    <circle cx="130" cy="320" r="14" fill="#ffb000"/>
    <circle cx="270" cy="320" r="40" fill="#080200"/>
    <circle cx="270" cy="320" r="14" fill="#ffb000"/>
    <line x1="130" y1="360" x2="270" y2="360" stroke="#ffb000" stroke-width="3"/>
  </g>
  <g fill="#ffb000" font-family="'Courier New', monospace" font-size="12" font-weight="bold">
    <text x="80" y="270" fill="#ffd000">TAPE RECORDER // UNIT-01</text>
    <text x="80" y="415">STATUS: RECORDING [ONLINE]</text>

    <!-- Waveform Box -->
    <rect x="60" y="460" width="280" height="120" stroke="#ffb000" stroke-width="2" fill="#140600" opacity="0.8"/>
    <text x="80" y="490" fill="#ffd000">SPECTRAL FREQ: 1420.4 MHz</text>
    <path d="M 70,530 L 100,530 L 115,500 L 130,560 L 145,490 L 160,550 L 175,520 L 190,540 L 220,530 L 330,530" stroke="#ffd000" stroke-width="2.5" fill="none" filter="url(#amberGlow)"/>
  </g>

  <!-- RIGHT WING: TELEMETRY & SIGNAL METERS -->
  <g fill="#140600" stroke="#ffb000" stroke-width="2" opacity="0.8">
    <rect x="1580" y="240" width="280" height="200"/>
  </g>
  <g fill="#ffb000" font-family="'Courier New', monospace" font-size="12" font-weight="bold">
    <text x="1600" y="270" fill="#ffd000">SYSTEM TELEMETRY</text>
    <text x="1600" y="300">CORE: Z80-A @ 4.0MHz</text>
    <text x="1600" y="325">AZIMUTH: 142.8°</text>
    <text x="1600" y="350">ELEVATION: 36.2°</text>
    <text x="1600" y="375">RANGE: 280,000 KM</text>
    <text x="1600" y="415" fill="#ffd000">> SIGNAL LOCK: 98% [OK]</text>

    <!-- Signal Level Bar Box -->
    <rect x="1580" y="460" width="280" height="120" stroke="#ffb000" stroke-width="2" fill="#140600" opacity="0.8"/>
    <text x="1600" y="490" fill="#ffd000">CARRIER POWER LEVEL</text>
    <rect x="1600" y="510" width="240" height="22" stroke="#ffb000" stroke-width="1.5" fill="none"/>
    <rect x="1603" y="513" width="220" height="16" fill="#ffb000" filter="url(#amberGlow)"/>
    <text x="1600" y="555">> READY FOR LINK</text>
  </g>

  <!-- 3D AMBER PHOSPHOR HORIZON GRID -->
  <g stroke="#ffb000" stroke-width="2" opacity="0.6">
    <line x1="0" y1="720" x2="1920" y2="720" stroke="#ffd000" stroke-width="4" filter="url(#amberGlow)"/>
    <line x1="0" y1="750" x2="1920" y2="750"/>
    <line x1="0" y1="785" x2="1920" y2="785"/>
    <line x1="0" y1="825" x2="1920" y2="825"/>
    <line x1="0" y1="875" x2="1920" y2="875"/>
    <line x1="0" y1="935" x2="1920" y2="935"/>
    <line x1="0" y1="1005" x2="1920" y2="1005"/>
    <line x1="0" y1="1080" x2="1920" y2="1080" stroke="#ffd000" stroke-width="5"/>

    <!-- Vanishing Lines to Center Horizon (960, 720) -->
    <line x1="960" y1="720" x2="960" y2="1080" stroke="#ffd000" stroke-width="3" filter="url(#amberGlow)"/>
    <line x1="960" y1="720" x2="800" y2="1080"/>
    <line x1="960" y1="720" x2="1120" y2="1080"/>
    <line x1="960" y1="720" x2="620" y2="1080"/>
    <line x1="960" y1="720" x2="1300" y2="1080"/>
    <line x1="960" y1="720" x2="420" y2="1080"/>
    <line x1="960" y1="720" x2="1500" y2="1080"/>
    <line x1="960" y1="720" x2="200" y2="1080"/>
    <line x1="960" y1="720" x2="1720" y2="1080"/>
    <line x1="960" y1="720" x2="-80" y2="1080"/>
    <line x1="960" y1="720" x2="2000" y2="1080"/>
  </g>
</svg>
