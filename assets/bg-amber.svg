<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="amberSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080400"/>
      <stop offset="60%" stop-color="#140800"/>
      <stop offset="100%" stop-color="#240f00"/>
    </linearGradient>

    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND VOID -->
  <rect width="1920" height="1080" fill="url(#amberSky)"/>

  <!-- DEEP SPACE OBSERVATORY RADAR DISPLAY (Centered Top/Mid) -->
  <g stroke="#ffb000" fill="none" opacity="0.35" filter="url(#amberGlow)">
    <!-- Radar Rings -->
    <circle cx="960" cy="450" r="120" stroke-width="1.5"/>
    <circle cx="960" cy="450" r="240" stroke-width="1.5" stroke-dasharray="8,8"/>
    <circle cx="960" cy="450" r="360" stroke-width="2"/>
    <circle cx="960" cy="450" r="480" stroke-width="1.5" stroke-dasharray="4,8"/>

    <!-- Crosshairs & Azimuth Axes -->
    <line x1="420" y1="450" x2="1500" y2="450" stroke-width="2"/>
    <line x1="960" y1="0" x2="960" y2="800" stroke-width="2"/>
    <line x1="620" y1="110" x2="1300" y2="790" stroke-width="1" stroke-dasharray="6,6"/>
    <line x1="620" y1="790" x2="1300" y2="110" stroke-width="1" stroke-dasharray="6,6"/>

    <!-- Planetary Orbital Ellipses -->
    <ellipse cx="960" cy="450" rx="420" ry="180" stroke="#ffd000" stroke-width="1" stroke-dasharray="4,4"/>
    <ellipse cx="960" cy="450" rx="280" ry="90" stroke="#ffd000" stroke-width="1.5"/>
    <circle cx="1240" cy="450" r="8" fill="#ffb000"/>
    <circle cx="780" cy="400" r="5" fill="#ff5500"/>
  </g>

  <!-- OSCILLOSCOPE WAVEFORM & TELEMETRY PANELS (Left & Right Wings) -->
  <g fill="#ffb000" font-family="'Courier New', monospace" font-size="12" font-weight="bold" opacity="0.55">
    <!-- Left Wing Telemetry -->
    <rect x="80" y="200" width="260" height="180" stroke="#ffb000" stroke-width="2" fill="#120600" opacity="0.8"/>
    <text x="100" y="230" fill="#ffd000">DEEP SPACE RADAR // 1982</text>
    <text x="100" y="255">FREQ: 1420.405 MHz</text>
    <text x="100" y="275">AZIMUTH: 142.8°</text>
    <text x="100" y="295">ELEVATION: 36.2°</text>
    <text x="100" y="315">RANGE: 280,000 KM</text>
    <text x="100" y="345" fill="#ffd000">> SIGNAL LOCKED [OK]</text>

    <!-- Left Waveform Box -->
    <rect x="80" y="410" width="260" height="90" stroke="#ffb000" stroke-width="2" fill="#120600" opacity="0.8"/>
    <path d="M 90,455 L 120,455 L 135,430 L 150,480 L 165,420 L 180,470 L 195,445 L 210,460 L 240,455 L 330,455" stroke="#ffb000" stroke-width="2" fill="none"/>

    <!-- Right Wing Telemetry -->
    <rect x="1580" y="200" width="260" height="180" stroke="#ffb000" stroke-width="2" fill="#120600" opacity="0.8"/>
    <text x="1600" y="230" fill="#ffd000">SYSTEM TELEMETRY</text>
    <text x="1600" y="255">CORE TEMP: 34.2 °C</text>
    <text x="1600" y="275">BUS VOLTAGE: 5.02 V</text>
    <text x="1600" y="295">CHIP: Z80-A @ 4.0MHz</text>
    <text x="1600" y="315">MEM: 64K D-RAM OK</text>
    <text x="1600" y="345" fill="#ffd000">> OTAQ.GG READY</text>

    <!-- Right Signal Meter -->
    <rect x="1580" y="410" width="260" height="90" stroke="#ffb000" stroke-width="2" fill="#120600" opacity="0.8"/>
    <text x="1600" y="435">SIGNAL STRENGTH: 98%</text>
    <rect x="1600" y="450" width="220" height="16" stroke="#ffb000" stroke-width="1" fill="none"/>
    <rect x="1602" y="452" width="200" height="12" fill="#ffb000"/>
  </g>

  <!-- 3D AMBER PHOSPHOR HORIZON GRID -->
  <g stroke="#ffb000" stroke-width="2" opacity="0.55">
    <line x1="0" y1="780" x2="1920" y2="780" stroke="#ffd000" stroke-width="3"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="0" y1="845" x2="1920" y2="845"/>
    <line x1="0" y1="885" x2="1920" y2="885"/>
    <line x1="0" y1="935" x2="1920" y2="935"/>
    <line x1="0" y1="995" x2="1920" y2="995"/>
    <line x1="0" y1="1070" x2="1920" y2="1070" stroke="#ffd000" stroke-width="4"/>

    <!-- Vanishing Lines to Center Horizon (960, 780) -->
    <line x1="960" y1="780" x2="960" y2="1080" stroke="#ffd000" stroke-width="2"/>
    <line x1="960" y1="780" x2="800" y2="1080"/>
    <line x1="960" y1="780" x2="1120" y2="1080"/>
    <line x1="960" y1="780" x2="620" y2="1080"/>
    <line x1="960" y1="780" x2="1300" y2="1080"/>
    <line x1="960" y1="780" x2="420" y2="1080"/>
    <line x1="960" y1="780" x2="1500" y2="1080"/>
    <line x1="960" y1="780" x2="200" y2="1080"/>
    <line x1="960" y1="780" x2="1720" y2="1080"/>
  </g>
</svg>
