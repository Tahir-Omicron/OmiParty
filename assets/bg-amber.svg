<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Warm Mahogany/Amber Gradient -->
    <linearGradient id="amberSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050200"/>
      <stop offset="40%" stop-color="#120600"/>
      <stop offset="75%" stop-color="#240b00"/>
      <stop offset="100%" stop-color="#3b1500"/>
    </linearGradient>

    <!-- Amber Phosphor Glow -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND VOID -->
  <rect width="1920" height="1080" fill="url(#amberSky)"/>

  <!-- TWINKLING AMBER TELEMETRY STARS (Stationary) -->
  <g fill="#ffb000" opacity="0.65">
    <rect x="100" y="50" width="3" height="3"/>
    <rect x="220" y="110" width="2" height="2"/>
    <rect x="360" y="70" width="4" height="4" filter="url(#amberGlow)"/>
    <rect x="540" y="130" width="3" height="3"/>
    <rect x="720" y="60" width="2" height="2"/>
    <rect x="1200" y="60" width="3" height="3"/>
    <rect x="1380" y="110" width="4" height="4" filter="url(#amberGlow)"/>
    <rect x="1560" y="70" width="2" height="2"/>
    <rect x="1740" y="120" width="3" height="3"/>
    <rect x="1860" y="50" width="2" height="2"/>
  </g>

  <!-- STATIONARY RADAR OBSERVATORY RETICLES (Center Crest) -->
  <g stroke="#ffb000" fill="none" opacity="0.45" filter="url(#amberGlow)">
    <circle cx="960" cy="380" r="100" stroke-width="1.5"/>
    <circle cx="960" cy="380" r="200" stroke-width="1.5" stroke-dasharray="8,8"/>
    <circle cx="960" cy="380" r="300" stroke-width="2"/>
    <circle cx="960" cy="380" r="400" stroke-width="1.5" stroke-dasharray="4,8"/>

    <!-- Crosshairs & Azimuth Axes -->
    <line x1="520" y1="380" x2="1400" y2="380" stroke-width="2"/>
    <line x1="960" y1="0" x2="960" y2="740" stroke-width="2"/>

    <!-- Planetary Orbits -->
    <ellipse cx="960" cy="380" rx="360" ry="150" stroke="#ffd000" stroke-width="1.5" stroke-dasharray="6,6"/>
    <circle cx="1220" cy="380" r="7" fill="#ffb000"/>
    <circle cx="800" cy="330" r="5" fill="#ff5500"/>
  </g>

  <!-- LEFT WING: TAPE REEL & OSCILLOSCOPE CONSOLE (Clean & Stationary) -->
  <g fill="#140600" stroke="#ffb000" stroke-width="2" opacity="0.8">
    <rect x="60" y="260" width="280" height="190"/>
    <!-- Tape Reels -->
    <circle cx="130" cy="340" r="38" fill="#080200"/>
    <circle cx="130" cy="340" r="12" fill="#ffb000"/>
    <circle cx="270" cy="340" r="38" fill="#080200"/>
    <circle cx="270" cy="340" r="12" fill="#ffb000"/>
    <line x1="130" y1="378" x2="270" y2="378" stroke="#ffb000" stroke-width="2.5"/>
  </g>
  <g fill="#ffb000" font-family="'Courier New', monospace" font-size="12" font-weight="bold">
    <text x="80" y="290" fill="#ffd000">TAPE RECORDER // UNIT-01</text>
    <text x="80" y="425">STATUS: READY [ONLINE]</text>

    <!-- Waveform Box -->
    <rect x="60" y="470" width="280" height="110" stroke="#ffb000" stroke-width="2" fill="#140600" opacity="0.8"/>
    <text x="80" y="500" fill="#ffd000">SPECTRAL FREQ: 1420.4 MHz</text>
    <path d="M 70,540 L 100,540 L 115,510 L 130,570 L 145,500 L 160,560 L 175,530 L 190,550 L 220,540 L 330,540" stroke="#ffd000" stroke-width="2.5" fill="none" filter="url(#amberGlow)"/>
  </g>

  <!-- RIGHT WING: TELEMETRY & SIGNAL METERS (Clean & Stationary) -->
  <g fill="#140600" stroke="#ffb000" stroke-width="2" opacity="0.8">
    <rect x="1580" y="260" width="280" height="190"/>
  </g>
  <g fill="#ffb000" font-family="'Courier New', monospace" font-size="12" font-weight="bold">
    <text x="1600" y="290" fill="#ffd000">SYSTEM TELEMETRY</text>
    <text x="1600" y="320">CORE: Z80-A @ 4.0MHz</text>
    <text x="1600" y="345">AZIMUTH: 142.8°</text>
    <text x="1600" y="370">ELEVATION: 36.2°</text>
    <text x="1600" y="395">RANGE: 280,000 KM</text>
    <text x="1600" y="425" fill="#ffd000">> SIGNAL LOCK: 98% [OK]</text>

    <!-- Signal Level Bar Box -->
    <rect x="1580" y="470" width="280" height="110" stroke="#ffb000" stroke-width="2" fill="#140600" opacity="0.8"/>
    <text x="1600" y="500" fill="#ffd000">CARRIER POWER LEVEL</text>
    <rect x="1600" y="520" width="240" height="20" stroke="#ffb000" stroke-width="1.5" fill="none"/>
    <rect x="1603" y="523" width="220" height="14" fill="#ffb000" filter="url(#amberGlow)"/>
    <text x="1600" y="560">> READY FOR LINK</text>
  </g>

  <!-- 3D AMBER PHOSPHOR HORIZON GRID (Stationary) -->
  <g stroke="#ffb000" stroke-width="2" opacity="0.6">
    <line x1="0" y1="740" x2="1920" y2="740" stroke="#ffd000" stroke-width="4" filter="url(#amberGlow)"/>
    <line x1="0" y1="770" x2="1920" y2="770"/>
    <line x1="0" y1="805" x2="1920" y2="805"/>
    <line x1="0" y1="845" x2="1920" y2="845"/>
    <line x1="0" y1="895" x2="1920" y2="895"/>
    <line x1="0" y1="955" x2="1920" y2="955"/>
    <line x1="0" y1="1025" x2="1920" y2="1025"/>
    <line x1="0" y1="1080" x2="1920" y2="1080" stroke="#ffd000" stroke-width="5"/>

    <!-- Vanishing Lines to Center Horizon (960, 740) -->
    <line x1="960" y1="740" x2="960" y2="1080" stroke="#ffd000" stroke-width="3" filter="url(#amberGlow)"/>
    <line x1="960" y1="740" x2="820" y2="1080"/>
    <line x1="960" y1="740" x2="1100" y2="1080"/>
    <line x1="960" y1="740" x2="660" y2="1080"/>
    <line x1="960" y1="740" x2="1260" y2="1080"/>
    <line x1="960" y1="740" x2="480" y2="1080"/>
    <line x1="960" y1="740" x2="1440" y2="1080"/>
    <line x1="960" y1="740" x2="280" y2="1080"/>
    <line x1="960" y1="740" x2="1640" y2="1080"/>
    <line x1="960" y1="740" x2="60" y2="1080"/>
    <line x1="960" y1="740" x2="1860" y2="1080"/>
  </g>
</svg>
