<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OTAQ.GG — Pixel Art Partiya Portalı</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Google Pixel & Retro Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700;800&family=Silkscreen:wght@400;700&family=Press+Start+2P&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Scripts -->
    <script src="words.js" defer></script>
    <script src="shared.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body class="pixel-body">
    <!-- Retro CRT Scanlines & Background Grid -->
    <div class="crt-scanlines"></div>
    <div class="pixel-grid-bg"></div>

    <!-- Top Action Bar (Pixelated) -->
    <header class="pixel-nav">
        <div class="pixel-brand">
            <div class="pixel-logo-icon">
                <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M2 2h4v2H2zM10 2h4v2h-4zM4 4h8v2H4zM2 6h12v4H2zM4 10h8v2H4zM6 12h4v2H6z"/>
                </svg>
            </div>
            <span class="pixel-nav-title">OTAQ<span class="p-cyan">.GG</span></span>
        </div>
        <div class="pixel-nav-actions">
            <!-- Chiptune BGM Button -->
            <button id="bgm-toggle" class="pixel-mini-btn p-bgm-btn" onclick="toggleBGM()" title="8-Bit Musiqi">
                <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" style="margin-right:4px;"><path d="M6 1h6v2H6V1zm4 2h2v7H9V8h1V3zM3 8h4v2H3V8zm0 2h1v3H3v-3zm3 0h1v3H6v-3zm-2 3h2v1H4v-1zm5-3h4v2H9v-2zm0 2h1v3H9v-3zm3 0h1v3h-1v-3zm-2 3h2v1h-2v-1z"/></svg>
                <span>BGM</span>
            </button>
            <button id="sound-toggle" class="pixel-mini-btn" onclick="toggleSound()" title="Səs">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M2 5h3l4-3v12l-4-3H2V5zm10 0h1v6h-1V5zm2-2h1v10h-1V3z"/>
                </svg>
            </button>
            <a href="index.html" class="pixel-mini-btn p-lang">EN</a>
            <button id="theme-toggle" class="pixel-mini-btn" onclick="toggleTheme()" title="Mövzu">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M7 1h2v2H7V1zm0 12h2v2H7v-2zM1 7h2v2H1V7zm12 0h2v2h-2V7zM3 3h2v2H3V3zm8 0h2v2h-2V3zM3 11h2v2H3v-2zm8 0h2v2h-2v-2z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- 3D Perspective Flip Card Wrapper -->
    <main class="pixel-perspective-wrapper">
        
        <!-- Interactive 8-Bit Pixel Mascot Companion -->
        <div class="pixel-companion-wrap">
            <div class="pixel-speech-bubble" id="pixel-companion-msg">SALAM QƏHRƏMAN!</div>
            <div class="pixel-mascot-pet" onclick="triggerMascotClick()" title="Məni kliklə!">
                <svg width="32" height="32" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M4 1h8v2H4V1zM2 3h12v2H2V3zM1 5h14v6H1V5zM3 11h10v2H3v-2zM5 13h6v2H5v-2z" fill="var(--accent-cyan)"/>
                    <path d="M4 7h3v2H4V7zm5 0h3v2H9V7z" fill="#000"/>
                    <path d="M7 11h2v1H7v-1z" fill="var(--accent-red)"/>
                </svg>
            </div>
        </div>

        <div id="auth-flip-card" class="pixel-flip-card">
            
            <!-- ================= FRONT: PIXEL LOGIN ================= -->
            <div class="pixel-card-face pixel-card-front pixel-box">
                <div class="pixel-card-header">
                    <div class="pixel-badge-avatar">
                        <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor" color="var(--accent-cyan)">
                            <path d="M5 1h6v2H5V1zm-2 2h2v2H3V3zm8 0h2v2h-2V3zM1 5h14v6H1V5zm2 6h2v2H3v-2zm8 0h2v2h-2v-2zm-6 2h6v2H5v-2z"/>
                            <path d="M4 7h2v2H4V7zm6 0h2v2h-2V7z" fill="#0b0f17"/>
                        </svg>
                    </div>
                    <h1 class="pixel-title">OTAQ<span class="p-cyan">.GG</span></h1>
                    <p class="pixel-subtitle">Xaos Dolu 8-Bit Partiya Oyunları</p>
                </div>

                <!-- 8-Bit Sliding Switcher (Sürüşdürməli Keçid) -->
                <div class="pixel-tabs-bar pixel-slider-toggle" id="front-slider-toggle" onclick="toggleAuthSlider(event, 'front')">
                    <!-- Physical Sliding Glider Pill -->
                    <div class="pixel-slider-glider" id="front-slider-glider"></div>
                    <button type="button" class="pixel-tab-btn active" id="front-tab-login" onclick="flipToAuth('login', event)">
                        <span class="p-tab-indicator">&gt;</span>
                        <span>DAXİL OL</span>
                    </button>
                    <button type="button" class="pixel-tab-btn" id="front-tab-register" onclick="flipToAuth('register', event)">
                        <span class="p-tab-indicator">&gt;</span>
                        <span>QEYDİYYAT</span>
                    </button>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="pixel-form" onsubmit="event.preventDefault(); handleLogin();">
                    <div class="pixel-input-group">
                        <label for="login-email" class="pixel-label">E-POÇT:</label>
                        <div class="pixel-input-wrap">
                            <input type="email" id="login-email" class="pixel-input" placeholder="oyuncu@otaq.gg" required autocomplete="email" onfocus="setMascotMsg('E-POÇT YAZ...')">
                        </div>
                    </div>

                    <div class="pixel-input-group">
                        <div class="pixel-label-row">
                            <label for="login-password" class="pixel-label">ŞİFRƏ:</label>
                            <span class="pixel-link" onclick="showToast('Şifrə unudulubsa Qonaq rejimi ilə daxil olun.', 'info')">[UNUTDUM]</span>
                        </div>
                        <div class="pixel-input-wrap">
                            <input type="password" id="login-password" class="pixel-input" placeholder="••••••••" required autocomplete="current-password" onfocus="setMascotMsg('GİZLİ ŞİFRƏ!')">
                            <button type="button" class="pixel-eye-btn" onclick="togglePasswordVisibility('login-password', this)" title="Şifrə">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="shape-rendering: crispEdges;">
                                    <path d="M8 6h8v2H8V6zm8 2h2v2h-2V8zm2 2h2v2h-2v-2zm2 2h2v2h-2v-2zm-2 2h-2v2h2v-2zm-2 2h-2v2h2v-2zm-2 2H8v-2h8v2zm-8-2H6v-2h2v2zm-2-2H4v-2h2v2zm-2-2H2v-2h2v2zm2-2h2V8H4v2zm2-2h2V6H6v2z" fill="currentColor"/>
                                    <rect x="9" y="9" width="6" height="6" fill="var(--accent-cyan)"/>
                                    <rect x="11" y="11" width="2" height="2" fill="#0b0e14"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="login-btn" class="pixel-btn pixel-btn-primary" onmouseover="setMascotMsg('BAŞLAMAĞA HAZIRSAN?')">
                        <span>BAŞLA (START)</span>
                    </button>

                    <div class="pixel-divider">
                        <span class="p-line"></span>
                        <span class="p-text">VƏ YA</span>
                        <span class="p-line"></span>
                    </div>

                    <button type="button" class="pixel-btn pixel-btn-secondary" onclick="handleGuestLogin()">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M1 1h14v14H1V1zm2 2v10h10V3H3zm2 2h2v2H5V5zm4 0h2v2H9V5zm-4 4h2v2H5V9zm4 0h2v2H9V9z"/>
                        </svg>
                        <span>QONAQ REJİMİ [1-CLICK]</span>
                    </button>
                </form>

                <!-- Footer Creator Badge -->
                <div class="pixel-footer">
                    <a href="https://instagram.com/tahirquliyev01" target="_blank" rel="noopener noreferrer" class="pixel-author-pill">
                        <svg width="10" height="10" viewBox="0 0 8 8" fill="var(--accent-gold)"><path d="M3 0h2v2H3V0zM1 2h2v2H1V2zM5 2h2v2H5V2zM3 4h2v2H3V4z"/></svg>
                        <span>KOD: <strong>@tahirquliyev01</strong></span>
                    </a>
                </div>
            </div>

            <!-- ================= BACK: PIXEL REGISTER ================= -->
            <div class="pixel-card-face pixel-card-back pixel-box">
                <div class="pixel-card-header">
                    <div class="pixel-badge-avatar p-badge-purple">
                        <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor" color="var(--accent-purple)">
                            <path d="M7 1h2v3h3v2H9v3H7V6H4V4h3V1zM2 11h12v3H2v-3z"/>
                        </svg>
                    </div>
                    <h1 class="pixel-title">HESAB <span class="p-purple">YARAT</span></h1>
                    <p class="pixel-subtitle">Yeni 8-Bit Qəhrəmanını Yarat</p>
                </div>

                <!-- 8-Bit Sliding Switcher (Sürüşdürməli Keçid) -->
                <div class="pixel-tabs-bar pixel-slider-toggle" id="back-slider-toggle" onclick="toggleAuthSlider(event, 'back')">
                    <!-- Physical Sliding Glider Pill -->
                    <div class="pixel-slider-glider is-register" id="back-slider-glider"></div>
                    <button type="button" class="pixel-tab-btn" id="back-tab-login" onclick="flipToAuth('login', event)">
                        <span class="p-tab-indicator">&gt;</span>
                        <span>DAXİL OL</span>
                    </button>
                    <button type="button" class="pixel-tab-btn active" id="back-tab-register" onclick="flipToAuth('register', event)">
                        <span class="p-tab-indicator">&gt;</span>
                        <span>QEYDİYYAT</span>
                    </button>
                </div>

                <!-- Register Form with Character Class Selector -->
                <form id="register-form" class="pixel-form" onsubmit="event.preventDefault(); handleRegister();">
                    
                    <!-- 8-Bit Character Class Selector -->
                    <div class="pixel-avatar-picker-wrap">
                        <button type="button" class="pixel-avatar-arrow" onclick="cyclePixelAvatar(-1)" title="Əvvəlki">&lt;</button>
                        <div class="pixel-avatar-display">
                            <img id="pixel-reg-avatar-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=HeroKnight" alt="Avatar" class="pixel-avatar-preview">
                            <span id="pixel-avatar-title" class="pixel-class-tag">CYBER CƏNGAVƏR</span>
                        </div>
                        <button type="button" class="pixel-avatar-arrow" onclick="cyclePixelAvatar(1)" title="Növbəti">&gt;</button>
                    </div>

                    <div class="pixel-input-group">
                        <label for="reg-email" class="pixel-label">E-POÇT:</label>
                        <div class="pixel-input-wrap">
                            <input type="email" id="reg-email" class="pixel-input" placeholder="oyuncu@otaq.gg" required autocomplete="email" onfocus="setMascotMsg('YENİ E-POÇT!')">
                        </div>
                    </div>

                    <div class="pixel-input-group">
                        <div class="pixel-label-row">
                            <label for="reg-nickname" class="pixel-label">LƏQƏB:</label>
                            <button type="button" class="pixel-dice-btn" onclick="generateRandomRegNickname()" title="Təsadüfi">
                                <span>[RANDOM]</span>
                            </button>
                        </div>
                        <div class="pixel-input-wrap">
                            <input type="text" id="reg-nickname" class="pixel-input" placeholder="Məs: PixelMaster_99" maxlength="16" required autocomplete="username" onfocus="setMascotMsg('GÖZƏL LƏQƏB!')">
                        </div>
                    </div>

                    <div class="pixel-input-group">
                        <label for="reg-password" class="pixel-label">ŞİFRƏ (MİN 6):</label>
                        <div class="pixel-input-wrap">
                            <input type="password" id="reg-password" class="pixel-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                            <button type="button" class="pixel-eye-btn" onclick="togglePasswordVisibility('reg-password', this)" title="Şifrə">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="shape-rendering: crispEdges;">
                                    <path d="M8 6h8v2H8V6zm8 2h2v2h-2V8zm2 2h2v2h-2v-2zm2 2h2v2h-2v-2zm-2 2h-2v2h2v-2zm-2 2h-2v2h2v-2zm-2 2H8v-2h8v2zm-8-2H6v-2h2v2zm-2-2H4v-2h2v2zm-2-2H2v-2h2v2zm2-2h2V8H4v2zm2-2h2V6H6v2z" fill="currentColor"/>
                                    <rect x="9" y="9" width="6" height="6" fill="var(--accent-purple)"/>
                                    <rect x="11" y="11" width="2" height="2" fill="#0b0e14"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="register-btn" class="pixel-btn pixel-btn-purple">
                        <span>HESABI TƏSDİQLƏ</span>
                    </button>
                </form>

                <!-- Footer Creator Badge -->
                <div class="pixel-footer">
                    <a href="https://instagram.com/tahirquliyev01" target="_blank" rel="noopener noreferrer" class="pixel-author-pill">
                        <svg width="10" height="10" viewBox="0 0 8 8" fill="var(--accent-gold)"><path d="M3 0h2v2H3V0zM1 2h2v2H1V2zM5 2h2v2H5V2zM3 4h2v2H3V4z"/></svg>
                        <span>KOD: <strong>@tahirquliyev01</strong></span>
                    </a>
                </div>
            </div>

        </div>
    </main>

    <!-- Guest Modal (Pixelated) -->
    <div id="guest-modal" class="modal-overlay" style="display: none;">
        <div class="pixel-box pixel-modal-box text-center">
            <h2 class="pixel-modal-title">QONAQ GİRİŞİ</h2>
            <p class="pixel-modal-desc">Ləqəbinizi təyin edin və oyuna başlayın:</p>
            <div class="pixel-input-wrap" style="margin-bottom: 1rem;">
                <input type="text" id="guest-nickname-input" class="pixel-input text-center" maxlength="16" placeholder="Ləqəbiniz...">
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="pixel-btn pixel-btn-ghost" onclick="document.getElementById('guest-modal').style.display='none'" style="flex:1;">LƏĞV</button>
                <button class="pixel-btn pixel-btn-primary" onclick="processGuestLogin(); document.getElementById('guest-modal').style.display='none';" style="flex:1;">OYNA</button>
            </div>
        </div>
    </div>
</body>
</html>
