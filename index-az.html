<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OTAQ.GG — Giriş və Qeydiyyat</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Scripts -->
    <script src="words.js" defer></script>
    <script src="shared.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body class="auth-only-body">
    <!-- Ambient Background Glows -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <!-- Top Action Bar -->
    <header class="top-nav">
        <div class="brand-mini">
            <img src="favicon.svg" alt="OTAQ.gg" class="nav-logo">
            <span class="nav-title">OTAQ<span>.gg</span></span>
        </div>
        <div class="nav-actions">
            <button id="sound-toggle" class="nav-btn" onclick="toggleSound()" title="Səs">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            </button>
            <a href="index.html" class="nav-btn nav-lang-btn">EN</a>
            <button id="theme-toggle" class="nav-btn" onclick="toggleTheme()" title="Mövzu">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </header>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Main Auth Center Container -->
    <main class="auth-wrapper">
        <div class="auth-card glass-panel">
            <!-- Brand Header -->
            <div class="auth-header">
                <div class="auth-logo-badge">
                    <img src="favicon.svg" alt="OTAQ" class="auth-logo-img">
                </div>
                <h1 class="auth-brand-name">OTAQ<span class="brand-dot">.GG</span></h1>
                <p class="auth-subtitle">Dostlar üçün xaos dolu partiya oyunları platforması</p>
            </div>

            <!-- Tab Switcher (Daxil Ol / Qeydiyyat) -->
            <div class="auth-tabs">
                <button id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                    Daxil Ol
                </button>
                <button id="tab-register" class="auth-tab" onclick="switchAuthTab('register')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    Qeydiyyat
                </button>
            </div>

            <!-- Form 1: Login Form -->
            <form id="login-form" class="auth-form" onsubmit="event.preventDefault(); handleLogin();">
                <div class="input-group">
                    <label for="login-email" class="input-label">E-poçt Ünvanı</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        </span>
                        <input type="email" id="login-email" class="custom-input" placeholder="adınız@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="login-password" class="input-label">Şifrə</label>
                        <span class="forgot-link" onclick="showToast('Şifrənizi xatırlamırsınızsa qonaq rejimindən istifadə edin.', 'info')">Unutmusunuz?</span>
                    </div>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </span>
                        <input type="password" id="login-password" class="custom-input" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('login-password')" title="Şifrəni göstər/gizlət">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary btn-block auth-submit-btn">
                    <span>Daxil Ol</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>

                <div class="auth-divider">
                    <span>və ya qeydiyyatsız</span>
                </div>

                <button type="button" id="guest-btn" class="btn btn-secondary btn-block guest-btn" onclick="handleGuestLogin()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><circle cx="15.5" cy="8.5" r="1.5"></circle><circle cx="15.5" cy="15.5" r="1.5"></circle><circle cx="8.5" cy="15.5" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle></svg>
                    <span>Qonaq Kimi Oyna</span>
                </button>
            </form>

            <!-- Form 2: Register Form -->
            <form id="register-form" class="auth-form" style="display: none;" onsubmit="event.preventDefault(); handleRegister();">
                <div class="input-group">
                    <label for="reg-email" class="input-label">E-poçt Ünvanı</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        </span>
                        <input type="email" id="reg-email" class="custom-input" placeholder="adınız@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="reg-nickname" class="input-label">Oyunçu Ləqəbi (Nickname)</label>
                        <button type="button" class="random-nick-btn" onclick="generateRandomRegNickname()" title="Təsadüfi ləqəb yarat">🎲 Təsadüfi</button>
                    </div>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>
                        </span>
                        <input type="text" id="reg-nickname" class="custom-input" placeholder="Məs: XaosKralı_77" maxlength="16" required autocomplete="username">
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-password" class="input-label">Şifrə Təyin Edin</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </span>
                        <input type="password" id="reg-password" class="custom-input" placeholder="Minimum 6 simvol" required minlength="6" autocomplete="new-password">
                        <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('reg-password')" title="Şifrəni göstər/gizlət">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="register-btn" class="btn btn-primary btn-block auth-submit-btn">
                    <span>Hesab Yarat</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </form>

            <!-- Creator & Ecosystem Footer -->
            <div class="auth-footer">
                <a href="https://instagram.com/tahirquliyev01" target="_blank" rel="noopener noreferrer" class="creator-badge">
                    <span class="creator-spark">✨</span>
                    <span>Yaradıcı: <strong>@tahirquliyev01</strong></span>
                </a>
            </div>
        </div>
    </main>

    <!-- Guest Nickname Modal -->
    <div id="guest-modal" class="modal-overlay" style="display: none;">
        <div class="glass-panel modal-card text-center">
            <h2 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 6px;">Qonaq Girişi 🎲</h2>
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1.25rem;">Oyunda görünəcək ləqəbinizi təsdiq edin</p>
            <div class="input-wrapper" style="margin-bottom: 1.25rem;">
                <input type="text" id="guest-nickname-input" class="custom-input" maxlength="16" placeholder="Ləqəbiniz...">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-ghost" onclick="document.getElementById('guest-modal').style.display='none'" style="flex:1;">Ləğv et</button>
                <button class="btn btn-primary" onclick="processGuestLogin(); document.getElementById('guest-modal').style.display='none';" style="flex:1; font-weight:800;">Oyna 🎲</button>
            </div>
        </div>
    </div>
</body>
</html>
