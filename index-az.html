<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otaq.gg — Party Games</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Game Data -->
    <script src="words.js" defer></script>
    
    <!-- Game Mode Modules -->
    <script src="canvas-game.js" defer></script>
    <script src="wordbomb-game.js" defer></script>
    
    <!-- App Logic (must load last) -->
    <script src="shared.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <div style="position:fixed; top:10px; right:10px; z-index:9999; display: flex; gap: 8px;">
        <a href="index.html" class="btn btn-ghost" style="text-decoration: none; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; height: 40px; padding: 0 12px;">EN</a>
        <button id="theme-toggle" class="btn btn-ghost" onclick="toggleTheme()" style="height: 40px; width: 40px; display: flex; align-items: center; justify-content: center; font-size: 18px;">☀️</button>
    </div>
    <div id="toast-container" class="toast-container"></div>

    <!-- Screen 1: Nickname -->
    <div class="screen active" data-screen="nickname">
        <div class="glass-panel text-center">
            <h1>OTAQ<span class="logo-accent">.gg</span></h1>
            <p>Party games for chaotic friends</p>
            <input type="text" id="nickname-input" placeholder="Ləqəbinizi daxil edin" maxlength="16" autocomplete="off">
            <button id="nickname-btn" class="btn btn-primary">Arenaya Daxil Ol</button>
        </div>
    </div>

    <!-- Screen 2: Menu -->
    <div class="screen" data-screen="menu">
        <div class="glass-panel text-center menu-panel">
            <h2>Welcome, <span id="menu-nickname"></span></h2>
            <button id="create-room-btn" class="btn btn-primary btn-lg">Otaq Yarat</button>
            
            <div class="divider">or</div>
            
            <div class="join-group">
                <input type="text" id="join-code-input" placeholder="ROOM CODE" maxlength="5" autocomplete="off" style="text-transform:uppercase">
                <button id="join-submit-btn" class="btn btn-secondary">Qoşul</button>
            </div>
        </div>
    </div>

    <!-- Screen 3: Lobby -->
    <div class="screen" data-screen="lobby">
        <div class="glass-panel lobby-panel">
            <div class="lobby-header">
                <h2>Room: <span id="lobby-code" class="room-code"></span><button id="copy-code-btn" class="btn btn-ghost" title="Copy Room Code">📋</button></h2>
            </div>
            
            <div id="lobby-players" class="player-grid"></div>
            
            <div id="lobby-host-controls" class="host-controls" style="display: none;">
                <h3>Select Game Mode</h3>
                <div class="mode-cards">
                    <button class="mode-card" data-mode="sabotage">
                        <span class="mode-icon">🕵️</span>
                        <span class="mode-name">Sabotage</span>
                        <span class="mode-desc">Xainləri tapın</span>
                    </button>
                    <button class="mode-card" data-mode="auction">
                        <span class="mode-icon">💰</span>
                        <span class="mode-name">Auction Chaos</span>
                        <span class="mode-desc">Həyatınız bahasına təklif verin</span>
                    </button>
                    <button class="mode-card" data-mode="canvas">
                        <span class="mode-icon">🎨</span>
                        <span class="mode-name">Liar's Canvas</span>
                        <span class="mode-desc">Bir saxtakar, bir kətan, onları tap</span>
                    </button>
                    <button class="mode-card" data-mode="wordbomb">
                        <span class="mode-icon">💣</span>
                        <span class="mode-name">Word Bomb</span>
                        <span class="mode-desc">Tez yaz və ya partla</span>
                    </button>
                </div>
                <div class="host-action-buttons">
                    <button id="add-bot-btn" class="btn btn-secondary">Add Bot 🤖</button>
                    <button id="start-game-btn" class="btn btn-primary btn-lg" disabled>Oyuna Başla</button>
                </div>
            
            <p id="lobby-player-count" class="player-count"></p>
            <button id="leave-room-btn" class="btn btn-ghost btn-sm">Otaqdan Çıx</button>
        </div>
    </div>

    <!-- Screen 4: Sabotage -->
    <div class="screen" data-screen="sabotage">
        <div class="sabotage-container">
            <div class="sabotage-header">
                <div id="sabotage-scoreboard" class="scoreboard"></div>
                <div id="sabotage-round-info" class="round-info"></div>
            </div>
            <div id="sabotage-main-area" class="game-main-area"></div>
        </div>
    </div>

    <!-- Screen 5: Auction -->
    <div class="screen" data-screen="auction">
        <div class="auction-container">
            <div class="auction-header">
                <div id="auction-round-info" class="round-info"></div>
            </div>
            <div id="auction-hp-bars" class="hp-bars-container"></div>
            <div id="auction-main-area" class="game-main-area"></div>
        </div>
    </div>

    <!-- Screen 6: Liar's Canvas -->
    <div class="screen" data-screen="canvas">
        <div class="canvas-container">
            <div class="canvas-header">
                <div id="canvas-round-info" class="round-info"></div>
                <div id="canvas-player-turn" class="cv-player-turn"></div>
            </div>
            <div id="canvas-main-area" class="game-main-area"></div>
        </div>
    </div>

    <!-- Screen 7: Word Bomb -->
    <div class="screen" data-screen="wordbomb">
        <div class="wordbomb-container">
            <div class="wordbomb-header">
                <div id="wordbomb-round-info" class="round-info"></div>
            </div>
            <div id="wordbomb-main-area" class="game-main-area"></div>
        </div>
    </div>

    <!-- Screen 6: Game Over -->
    <div class="screen" data-screen="gameover">
        <div class="glass-panel gameover-panel text-center">
            <h1 id="gameover-title" class="gameover-title"></h1>
            <p id="gameover-message" class="gameover-message"></p>
            <div id="gameover-details" class="gameover-details"></div>
            <button id="gameover-lobby-btn" class="btn btn-primary btn-lg mt-4">Back to Lobby</button>
        </div>
    </div>
</body>
</html>
