<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otaq.gg — Party Games</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Game Data -->
    <script src="words.js" defer></script>
    
    <!-- Game Mode Modules -->
    <script src="canvas-game.js" defer></script>
    <script src="wordbomb-game.js" defer></script>
    
    <!-- App Logic (must load last) -->
    <script src="shared.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <div style="position:fixed; top:10px; right:10px; z-index:9999; display: flex; gap: 8px;">
        <a href="index.html" class="btn btn-ghost" style="text-decoration: none; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; height: 40px; padding: 0 12px;">EN</a>
        <button id="theme-toggle" class="btn btn-ghost" onclick="toggleTheme()" style="height: 40px; width: 40px; display: flex; align-items: center; justify-content: center; font-size: 18px;">☀️</button>
    </div>
    <div id="toast-container" class="toast-container"></div>

    <!-- Screen 1: Auth (Login/Register) -->
    <div class="screen active" data-screen="auth">
        <div class="glass-panel text-center" style="max-width: 360px;">
            <h1>OTAQ<span class="logo-accent">.gg</span></h1>
            <p>Party games for chaotic friends</p>
            
            <div id="auth-forms">
                <!-- Login Form -->
                <div id="login-form">
                    <input type="email" id="login-email" placeholder="E-poçt" autocomplete="off">
                    <input type="password" id="login-password" placeholder="Şifrə" autocomplete="off">
                    <button id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Daxil ol</button>
                    <div class="divider" style="margin: 15px 0;">və ya</div>
                    <button id="guest-btn" class="btn btn-secondary" style="width: 100%;">Qonaq kimi oyna 🎲</button>
                    <p style="margin-top: 15px; font-size: 14px; cursor: pointer; color: var(--accent-cyan);" onclick="toggleAuthMode('register')">Hesabınız yoxdur? Qeydiyyat</p>
                </div>
                
                <!-- Register Form (Hidden by default) -->
                <div id="register-form" style="display: none;">
                    <input type="email" id="reg-email" placeholder="E-poçt" autocomplete="off">
                    <input type="text" id="reg-nickname" placeholder="Ləqəb" maxlength="16" autocomplete="off">
                    <input type="password" id="reg-password" placeholder="Şifrə" autocomplete="off">
                    <button id="register-btn" class="btn btn-secondary" style="width: 100%; margin-top: 10px;">Hesab Yarat</button>
                    <p style="margin-top: 15px; font-size: 14px; cursor: pointer; color: var(--accent-cyan);" onclick="toggleAuthMode('login')">Artıq hesabınız var? Daxil ol</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Screen 2: Menu -->
    <div class="screen" data-screen="menu">
        <div class="glass-panel text-center menu-panel">
            <div class="profile-banner" style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; background: var(--bg-secondary); padding: 10px; border-radius: var(--radius-md);">
                <img id="profile-avatar" src="" alt="Avatar" style="width: 50px; height: 50px; border-radius: 50%; cursor: pointer; border: 2px solid var(--accent-cyan);" onclick="showAvatarModal()">
                <div style="text-align: left;">
                    <h3 id="menu-nickname" style="margin: 0; font-size: 1.2rem;"></h3>
                    <div style="font-size: 0.8rem; color: var(--text-secondary);">Səviyyə <span id="profile-level">1</span></div>
                    <div style="width: 120px; height: 6px; background: var(--bg-primary); border-radius: 3px; margin-top: 4px; overflow: hidden;">
                        <div id="profile-xp-bar" style="height: 100%; width: 0%; background: var(--accent-cyan); transition: width 0.3s ease;"></div>
                    </div>
                </div>
            </div>
            
            <button id="create-room-btn" class="btn btn-primary btn-lg">Otaq Yarat</button>
            
            <div class="divider">or</div>
            
            <div class="join-group">
                <input type="text" id="join-code-input" placeholder="ROOM CODE" maxlength="5" autocomplete="off" style="text-transform:uppercase">
                <button id="join-submit-btn" class="btn btn-secondary">Qoşul</button>
            </div>
        </div>
    </div>

    <!-- Screen 3: Lobby -->
    <div class="screen" data-screen="lobby">
        <div class="glass-panel lobby-panel">
            <div class="lobby-header">
                <h2>Room: <span id="lobby-code" class="room-code"></span><button id="copy-code-btn" class="btn btn-ghost" title="Copy Room Code">📋</button></h2>
            </div>
            
            <div id="lobby-players" class="player-grid"></div>
            
            <div id="lobby-host-controls" class="host-controls" style="display: none;">
                <h3>Select Game Mode</h3>
                <div class="mode-cards">
                    <button class="mode-card" data-mode="sabotage">
                        <span class="mode-icon">🕵️</span>
                        <span class="mode-name">Sabotage</span>
                        <span class="mode-desc">Xainləri tapın</span>
                    </button>
                    <button class="mode-card" data-mode="auction">
                        <span class="mode-icon">💰</span>
                        <span class="mode-name">Auction Chaos</span>
                        <span class="mode-desc">Həyatınız bahasına təklif verin</span>
                    </button>
                    <button class="mode-card" data-mode="canvas">
                        <span class="mode-icon">🎨</span>
                        <span class="mode-name">Liar's Canvas</span>
                        <span class="mode-desc">Bir saxtakar, bir kətan, onları tap</span>
                    </button>
                    <button class="mode-card" data-mode="wordbomb">
                        <span class="mode-icon">💣</span>
                        <span class="mode-name">Word Bomb</span>
                        <span class="mode-desc">Tez yaz və ya partla</span>
                    </button>
                </div>
                
                <div class="hardcore-toggle-container host-only" style="margin: 1.5rem auto; display: flex; align-items: center; justify-content: center; gap: 1rem; display: none; background: rgba(251, 113, 133, 0.1); padding: 10px 25px; border-radius: 50px; border: 1px solid rgba(251, 113, 133, 0.3); width: fit-content; box-shadow: 0 4px 15px rgba(251, 113, 133, 0.1);">
                    <label class="switch">
                        <input type="checkbox" id="hardcore-mode-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span style="font-weight: 700; color: var(--accent-red); font-size: 1.1rem; letter-spacing: 1px; text-transform: uppercase;">🔥 Qatı Rejim</span>
                </div>

                <div class="host-action-buttons">
                    <button id="add-bot-btn" class="btn btn-secondary">Bot Əlavə Et 🤖</button>
                    <button id="start-game-btn" class="btn btn-primary btn-lg" disabled>Oyuna Başla</button>
                </div>
            
            <p id="lobby-player-count" class="player-count"></p>
            <button id="leave-room-btn" class="btn btn-ghost btn-sm">Otaqdan Çıx</button>
        </div>
    </div>

    <!-- Screen 4: Sabotage -->
    <div class="screen" data-screen="sabotage">
        <div class="sabotage-container">
            <div class="sabotage-header">
                <div id="sabotage-scoreboard" class="scoreboard"></div>
                <div id="sabotage-round-info" class="round-info"></div>
            </div>
            <div id="sabotage-main-area" class="game-main-area"></div>
        </div>
    </div>

    <!-- Screen 5: Auction -->
    <div class="screen" data-screen="auction">
        <div class="auction-container">
            <div class="auction-header">
                <div id="auction-round-info" class="round-info"></div>
            </div>
            <div id="auction-hp-bars" class="hp-bars-container"></div>
            <div id="auction-main-area" class="game-main-area"></div>
        </div>
    </div>

    <!-- Screen 6: Liar's Canvas -->
    <div class="screen" data-screen="canvas">
        <div class="canvas-container">
            <div class="canvas-header">
                <div id="canvas-round-info" class="round-info"></div>
                <div id="canvas-player-turn" class="cv-player-turn"></div>
            </div>
            <div id="canvas-main-area" class="game-main-area"></div>
        </div>
    </div>

    <!-- Screen 7: Word Bomb -->
    <div class="screen" data-screen="wordbomb">
        <div class="wordbomb-container">
            <div class="wordbomb-header">
                <div id="wordbomb-round-info" class="round-info"></div>
            </div>
            <div id="wordbomb-main-area" class="game-main-area"></div>
        </div>
    </div>

    <!-- Screen 6: Game Over -->
    <div class="screen" data-screen="gameover">
        <div class="glass-panel gameover-panel text-center">
            <h1 id="gameover-title" class="gameover-title"></h1>
            <p id="gameover-message" class="gameover-message"></p>
            <div id="gameover-details" class="gameover-details"></div>
            <button id="gameover-lobby-btn" class="btn btn-primary btn-lg mt-4">Back to Lobby</button>
        </div>
    </div>
    <div id="avatar-modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; align-items:center; justify-content:center;">
        <div class="glass-panel text-center" style="max-width: 400px; width: 90%;">
            <h3>Avatar Seçin</h3>
            <div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin: 20px 0;">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=A" class="avatar-option" onclick="selectAvatar(this.src)" style="width:60px; height:60px; border-radius:50%; cursor:pointer;">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=B" class="avatar-option" onclick="selectAvatar(this.src)" style="width:60px; height:60px; border-radius:50%; cursor:pointer;">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=C" class="avatar-option" onclick="selectAvatar(this.src)" style="width:60px; height:60px; border-radius:50%; cursor:pointer;">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=D" class="avatar-option" onclick="selectAvatar(this.src)" style="width:60px; height:60px; border-radius:50%; cursor:pointer;">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=E" class="avatar-option" onclick="selectAvatar(this.src)" style="width:60px; height:60px; border-radius:50%; cursor:pointer;">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=F" class="avatar-option" onclick="selectAvatar(this.src)" style="width:60px; height:60px; border-radius:50%; cursor:pointer;">
            </div>
            <button class="btn btn-secondary" onclick="document.getElementById('avatar-modal').style.display='none'">Bağla</button>
        </div>
    </div>

    <!-- App Logic (must load last) -->
    <script>
        function toggleAuthMode(mode) {
            document.getElementById('login-form').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = mode === 'register' ? 'block' : 'none';
        }
        function showAvatarModal() {
            document.getElementById('avatar-modal').style.display = 'flex';
        }
        async function selectAvatar(src) {
            document.getElementById('profile-avatar').src = src;
            document.getElementById('avatar-modal').style.display = 'none';
            // Trigger DB update logic in app.js
            if(window.updateUserAvatar) window.updateUserAvatar(src);
        }
    </script>
</body>
</html>
