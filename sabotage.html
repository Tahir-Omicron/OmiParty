<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sabotage - Otaq.gg</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <button id="theme-toggle" class="btn btn-ghost" onclick="toggleTheme()" style="position:fixed; top:10px; right:10px; z-index:9999;">☀️</button>
    <div id="toast-container" class="toast-container"></div>
    
    <div class="screen active" data-screen="sabotage">
        <div class="sabotage-container">
            <div class="sabotage-header">
                <div id="sabotage-scoreboard" class="scoreboard"></div>
                <div id="sabotage-round-info" class="round-info"></div>
            </div>
            <div id="sabotage-main-area" class="game-main-area"></div>
        </div>
    </div>
    
    <!-- Game Over Screen is shared or local? Local to the game page. -->
    <div class="screen" data-screen="gameover">
        <div class="glass-panel gameover-panel text-center">
            <h1 id="gameover-title" class="gameover-title"></h1>
            <p id="gameover-message" class="gameover-message"></p>
            <div id="gameover-details" class="gameover-details"></div>
            <button id="gameover-lobby-btn" class="btn btn-primary btn-lg mt-4">Back to Lobby</button>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="app.js"></script>
    <script src="canvas-game.js"></script>
    <script src="wordbomb-game.js"></script>
</body>
</html>
