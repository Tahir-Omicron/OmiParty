<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OTAQ.GG — Pixel Art Party Portal</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Google Pixel & Retro Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Silkscreen:wght@400;700&family=Press+Start+2P&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Scripts -->
    <script src="words.js" defer></script>
    <script src="shared.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body class="pixel-body">
    <!-- Retro CRT Scanlines & Grid Overlay -->
    <div class="crt-scanlines"></div>
    <div class="pixel-grid-bg"></div>

    <!-- Floating Pixel Stars -->
    <div class="pixel-star p-star-1"></div>
    <div class="pixel-star p-star-2"></div>
    <div class="pixel-star p-star-3"></div>
    <div class="pixel-star p-star-4"></div>

    <!-- Top Action Bar (Pixelated) -->
    <header class="pixel-nav">
        <div class="pixel-brand">
            <div class="pixel-logo-icon">
                <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M2 2h4v2H2zM10 2h4v2h-4zM4 4h8v2H4zM2 6h12v4H2zM4 10h8v2H4zM6 12h4v2H6z"/>
                </svg>
            </div>
            <span class="pixel-nav-title">OTAQ<span class="p-cyan">.GG</span></span>
        </div>
        <div class="pixel-nav-actions">
            <button id="sound-toggle" class="pixel-mini-btn" onclick="toggleSound()" title="Sound">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M2 5h3l4-3v12l-4-3H2V5zm10 0h1v6h-1V5zm2-2h1v10h-1V3z"/>
                </svg>
            </button>
            <a href="index-az.html" class="pixel-mini-btn p-lang">AZ</a>
            <button id="theme-toggle" class="pixel-mini-btn" onclick="toggleTheme()" title="Theme">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M7 1h2v2H7V1zm0 12h2v2H7v-2zM1 7h2v2H1V7zm12 0h2v2h-2V7zM3 3h2v2H3V3zm8 0h2v2h-2V3zM3 11h2v2H3v-2zm8 0h2v2h-2v-2z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- 3D Perspective Flip Card Wrapper -->
    <main class="pixel-perspective-wrapper">
        <div id="auth-flip-card" class="pixel-flip-card">
            
            <!-- ================= FRONT: PIXEL LOGIN ================= -->
            <div class="pixel-card-face pixel-card-front pixel-box">
                <div class="pixel-card-header">
                    <div class="pixel-badge-avatar">
                        <svg width="28" height="28" viewBox="0 0 16 16" fill="currentColor" color="var(--accent-cyan)">
                            <path d="M5 1h6v2H5V1zm-2 2h2v2H3V3zm8 0h2v2h-2V3zM1 5h14v6H1V5zm2 6h2v2H3v-2zm8 0h2v2h-2v-2zm-6 2h6v2H5v-2z"/>
                            <path d="M4 7h2v2H4V7zm6 0h2v2h-2V7z" fill="#0b0f17"/>
                        </svg>
                    </div>
                    <h1 class="pixel-title">OTAQ<span class="p-cyan">.GG</span></h1>
                    <p class="pixel-subtitle">Chaotic 8-Bit Party Games for Friends</p>
                </div>

                <!-- 8-Bit Tabs Switcher -->
                <div class="pixel-tabs-bar">
                    <button type="button" class="pixel-tab-btn active" onclick="flipToAuth('login')">
                        <span class="p-tab-indicator">&gt;</span>
                        <span>SIGN IN</span>
                    </button>
                    <button type="button" class="pixel-tab-btn" onclick="flipToAuth('register')">
                        <span class="p-tab-indicator">&gt;</span>
                        <span>REGISTER</span>
                    </button>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="pixel-form" onsubmit="event.preventDefault(); handleLogin();">
                    <div class="pixel-input-group">
                        <label for="login-email" class="pixel-label">EMAIL:</label>
                        <div class="pixel-input-wrap">
                            <input type="email" id="login-email" class="pixel-input" placeholder="player@otaq.gg" required autocomplete="email">
                        </div>
                    </div>

                    <div class="pixel-input-group">
                        <div class="pixel-label-row">
                            <label for="login-password" class="pixel-label">PASSWORD:</label>
                            <span class="pixel-link" onclick="showToast('If forgotten, play using Guest Mode.', 'info')">[FORGOT?]</span>
                        </div>
                        <div class="pixel-input-wrap">
                            <input type="password" id="login-password" class="pixel-input" placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" class="pixel-eye-btn" onclick="togglePasswordVisibility('login-password')" title="Password">
                                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                                    <path d="M2 7h12v2H2V7zm2-2h8v2H4V5zm0 6h8v2H4v-2z"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="login-btn" class="pixel-btn pixel-btn-primary">
                        <span>START GAME</span>
                    </button>

                    <div class="pixel-divider">
                        <span class="p-line"></span>
                        <span class="p-text">OR</span>
                        <span class="p-line"></span>
                    </div>

                    <button type="button" class="pixel-btn pixel-btn-secondary" onclick="handleGuestLogin()">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M1 1h14v14H1V1zm2 2v10h10V3H3zm2 2h2v2H5V5zm4 0h2v2H9V5zm-4 4h2v2H5V9zm4 0h2v2H9V9z"/>
                        </svg>
                        <span>GUEST PLAY [1-CLICK]</span>
                    </button>
                </form>

                <!-- Footer Creator Badge -->
                <div class="pixel-footer">
                    <a href="https://instagram.com/tahirquliyev01" target="_blank" rel="noopener noreferrer" class="pixel-author-pill">
                        <span class="p-spark">◆</span>
                        <span>DEV: <strong>@tahirquliyev01</strong></span>
                    </a>
                </div>
            </div>

            <!-- ================= BACK: PIXEL REGISTER ================= -->
            <div class="pixel-card-face pixel-card-back pixel-box">
                <div class="pixel-card-header">
                    <div class="pixel-badge-avatar p-badge-purple">
                        <svg width="28" height="28" viewBox="0 0 16 16" fill="currentColor" color="var(--accent-purple)">
                            <path d="M7 1h2v3h3v2H9v3H7V6H4V4h3V1zM2 11h12v3H2v-3z"/>
                        </svg>
                    </div>
                    <h1 class="pixel-title">NEW <span class="p-purple">ACCOUNT</span></h1>
                    <p class="pixel-subtitle">Create Your 8-Bit Legend</p>
                </div>

                <!-- 8-Bit Tabs Switcher -->
                <div class="pixel-tabs-bar">
                    <button type="button" class="pixel-tab-btn" onclick="flipToAuth('login')">
                        <span class="p-tab-indicator">&gt;</span>
                        <span>SIGN IN</span>
                    </button>
                    <button type="button" class="pixel-tab-btn active" onclick="flipToAuth('register')">
                        <span class="p-tab-indicator">&gt;</span>
                        <span>REGISTER</span>
                    </button>
                </div>

                <!-- Register Form -->
                <form id="register-form" class="pixel-form" onsubmit="event.preventDefault(); handleRegister();">
                    <div class="pixel-input-group">
                        <label for="reg-email" class="pixel-label">EMAIL:</label>
                        <div class="pixel-input-wrap">
                            <input type="email" id="reg-email" class="pixel-input" placeholder="player@otaq.gg" required autocomplete="email">
                        </div>
                    </div>

                    <div class="pixel-input-group">
                        <div class="pixel-label-row">
                            <label for="reg-nickname" class="pixel-label">NICKNAME:</label>
                            <button type="button" class="pixel-dice-btn" onclick="generateRandomRegNickname()" title="Random">
                                <span>[RANDOM 🎲]</span>
                            </button>
                        </div>
                        <div class="pixel-input-wrap">
                            <input type="text" id="reg-nickname" class="pixel-input" placeholder="e.g. PixelMaster_99" maxlength="16" required autocomplete="username">
                        </div>
                    </div>

                    <div class="pixel-input-group">
                        <label for="reg-password" class="pixel-label">PASSWORD (MIN 6):</label>
                        <div class="pixel-input-wrap">
                            <input type="password" id="reg-password" class="pixel-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                            <button type="button" class="pixel-eye-btn" onclick="togglePasswordVisibility('reg-password')" title="Password">
                                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                                    <path d="M2 7h12v2H2V7zm2-2h8v2H4V5zm0 6h8v2H4v-2z"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="register-btn" class="pixel-btn pixel-btn-purple">
                        <span>CREATE HERO</span>
                    </button>
                </form>

                <!-- Footer Creator Badge -->
                <div class="pixel-footer">
                    <a href="https://instagram.com/tahirquliyev01" target="_blank" rel="noopener noreferrer" class="pixel-author-pill">
                        <span class="p-spark">◆</span>
                        <span>DEV: <strong>@tahirquliyev01</strong></span>
                    </a>
                </div>
            </div>

        </div>
    </main>

    <!-- Guest Modal (Pixelated) -->
    <div id="guest-modal" class="modal-overlay" style="display: none;">
        <div class="pixel-box pixel-modal-box text-center">
            <h2 class="pixel-modal-title">GUEST LOGIN</h2>
            <p class="pixel-modal-desc">Set your player nickname and jump in:</p>
            <div class="pixel-input-wrap" style="margin-bottom: 1.25rem;">
                <input type="text" id="guest-nickname-input" class="pixel-input text-center" maxlength="16" placeholder="Your nickname...">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="pixel-btn pixel-btn-ghost" onclick="document.getElementById('guest-modal').style.display='none'" style="flex:1;">CANCEL</button>
                <button class="pixel-btn pixel-btn-primary" onclick="processGuestLogin(); document.getElementById('guest-modal').style.display='none';" style="flex:1;">PLAY</button>
            </div>
        </div>
    </div>
</body>
</html>
