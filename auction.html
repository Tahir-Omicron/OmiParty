<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auction Chaos - Otaq.gg</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <button id="theme-toggle" class="btn btn-ghost" onclick="toggleTheme()" style="position:fixed; top:10px; right:10px; z-index:9999; width:40px; height:40px; display:flex; align-items:center; justify-content:center; padding:0;"></button>
    <div id="toast-container" class="toast-container"></div>
    
    <div class="screen active" data-screen="auction">
        <div class="auction-container">
            <div class="auction-header">
                <div id="auction-round-info" class="round-info"></div>
            </div>
            <div id="auction-main-area" class="game-main-area">
                <div class="waiting-msg" style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:3rem;">
                    <div class="spinner"></div>
                    <p style="color:var(--text-secondary);">Loading game...</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="screen" data-screen="gameover">
        <div class="glass-panel gameover-panel text-center">
            <h1 id="gameover-title" class="gameover-title"></h1>
            <p id="gameover-message" class="gameover-message"></p>
            <div id="gameover-details" class="gameover-details"></div>
            <button id="gameover-lobby-btn" class="btn btn-primary btn-lg mt-4">Back to Lobby</button>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="app.js"></script>
    <script src="canvas-game.js"></script>
    <script src="wordbomb-game.js"></script>
</body>
</html>
